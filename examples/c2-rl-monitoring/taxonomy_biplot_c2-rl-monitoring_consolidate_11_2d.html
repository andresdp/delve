003eDimension 10: Lineage and Scenario Reproduction\u003c\u002fi\u003e","\u003cb\u003e10.5\u003c\u002fb\u003e: Reference-versus-optimized execution comparison\u003cbr\u003eCandidate execution is compared with a trusted reference implementation.\u003cbr\u003e\u003ci\u003eDimension 10: Lineage and Scenario Reproduction\u003c\u002fi\u003e","\u003cb\u003e10.6\u003c\u002fb\u003e: Output-equivalence correctness criterion\u003cbr\u003eCorrectness is judged by equality of observable outputs with a reference execution.\u003cbr\u003e\u003ci\u003eDimension 10: Lineage and Scenario Reproduction\u003c\u002fi\u003e","\u003cb\u003e10.7\u003c\u002fb\u003e: Simulator physics-assumption validation\u003cbr\u003eSimulator behavior and physics assumptions are checked against intended real-world behavior.\u003cbr\u003e\u003ci\u003eDimension 10: Lineage and Scenario Reproduction\u003c\u002fi\u003e","\u003cb\u003e10.8\u003c\u002fb\u003e: Simulator-induced exploit detection\u003cbr\u003eMonitoring detects exploits arising from simulator bugs, abstractions, or unintended interpretations.\u003cbr\u003e\u003ci\u003eDimension 10: Lineage and Scenario Reproduction\u003c\u002fi\u003e","\u003cb\u003e10.9\u003c\u002fb\u003e: Behavioral and execution-path validation\u003cbr\u003eValidation examines execution behavior and dependencies rather than output equality alone.\u003cbr\u003e\u003ci\u003eDimension 10: Lineage and Scenario Reproduction\u003c\u002fi\u003e","\u003cb\u003e10.10\u003c\u002fb\u003e: Post-release independent auditing\u003cbr\u003eExternal researchers audit released systems for reward hacks missed before release.\u003cbr\u003e\u003ci\u003eDimension 10: Lineage and Scenario Reproduction\u003c\u002fi\u003e"],"marker":{"color":"#3283FE","size":9},"mode":"markers","name":"10: Lineage and Scenario Reproduction","x":{"dtype":"f8","bdata":"TfJmkNHaxL9qAoLwszLWvze4CAxsPue\u002fPWHOjZRY6r8bMUNHuETnPwAAAAAAAPA\u002fsrjrsE3B3j\u002feJtQPLGTbv3gzbHqqr+Y\u002f1++iNX5V578="},"y":{"dtype":"f8","bdat
