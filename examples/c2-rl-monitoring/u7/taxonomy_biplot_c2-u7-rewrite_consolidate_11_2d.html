ol\u003c\u002fi\u003e","\u003cb\u003e10.5\u003c\u002fb\u003e: Human handover for unknown situations\u003cbr\u003eUnknown or unsupported situations are escalated to human operators instead of receiving autonomous control.\u003cbr\u003e\u003ci\u003eDimension 10: Release and Recovery Control\u003c\u002fi\u003e","\u003cb\u003e10.6\u003c\u002fb\u003e: Unknown-situation rejection\u003cbr\u003eThe agent rejects situations outside its reliable capability envelope.\u003cbr\u003e\u003ci\u003eDimension 10: Release and Recovery Control\u003c\u002fi\u003e","\u003cb\u003e10.7\u003c\u002fb\u003e: Safety-alert generation\u003cbr\u003eDetected unknown obstacles or situations generate operational safety alerts.\u003cbr\u003e\u003ci\u003eDimension 10: Release and Recovery Control\u003c\u002fi\u003e","\u003cb\u003e10.8\u003c\u002fb\u003e: Manual-reset avoidance\u003cbr\u003eIntegrated healing permits continued learning without manual resets.\u003cbr\u003e\u003ci\u003eDimension 10: Release and Recovery Control\u003c\u002fi\u003e","\u003cb\u003e10.9\u003c\u002fb\u003e: Agent resilience in production\u003cbr\u003eIntegrated monitoring and recovery improve autonomous-system resilience in changing environments.\u003cbr\u003e\u003ci\u003eDimension 10: Release and Recovery Control\u003c\u002fi\u003e"],"marker":{"color":"#3283FE","size":9},"mode":"markers","name":"10: Release and Recovery Control","x":{"dtype":"f8","bdata":"9UAp8cQJ1jyL1IF9\u002fFPSPPp0iPvODrA81asgtweBy7xkiG9PGOfSvMkGmzQV+tW84cP5GvAWzLytR04KBinQPN9fa0zk4cY8"},"y":{"dtype":"f8","bdata":"AAAAAAAA8L\u002fkL+q\u002f45zqv2rD6QQBUce\u002fTqNr0OH34z8eJOzQfnLrP5MuBws56e8\u002fr1M2lrdk5D\u002fofpGnEXfnv832q2bonOC\u002f"},"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e13.1\u003c\u002fb\u003e: Trip-wire vulnerabilities\u003cbr\u003eIntentionally exposed vulnerabilities provide detectable opportunities for reward-hacking behavior.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.2\u003c\u002fb\u003e: Reward-hacking monitoring alerts\u003cbr\u003eProduction alerts identify attempts to exploit the reward function.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.3\u003c\u002fb\u003e: Evaluator-generator self-reference\u003cbr\u003eThe same model performs judging and generation through prompt-differentiated roles.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.4\u003c\u002fb\u003e: Historical feedback visibility\u003cbr\u003eEvaluator and generator roles receive configurable access to prior feedback rounds and edits.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.5\u003c\u002fb\u003e: Game-environment tampering\u003cbr\u003eAgents alter monitored environments, opponents, or initial conditions to obtain higher reward.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.6\u003c\u002fb\u003e: Fine-tuning-process simulation\u003cbr\u003eAgents can create the appearance of fine-tuning without carrying out the intended optimization.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.7\u003c\u002fb\u003e: Evaluation-aware behavior\u003cbr\u003eAgents optimize the evaluator or measurement process rather than the intended task.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.8\u003c\u002fb\u003e: Capability-driven reward hacking\u003cbr\u003eGreater capability can increase proxy reward while reducing true reward through more effective exploitation.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.9\u003c\u002fb\u003e: Proxy-reward monitoring blind spot\u003cbr\u003eProxy metrics can improve while true or real-world reward deteriorates.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.10\u003c\u002fb\u003e: Local proxy-true-reward misalignment\u003cbr\u003eHigh aggregate correlation between proxy and true reward does not prevent catastrophic local misalignment.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.11\u003c\u002fb\u003e: Training-to-deployment hack generalization\u003cbr\u003eReward-hacking strategies learned on flawed tasks can transfer to novel deployed tasks.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.12\u003c\u002fb\u003e: Evaluator-oracle divergence\u003cbr\u003eEvaluator scores diverge from independent human-oracle scores under in-context reward hacking.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.13\u003c\u002fb\u003e: Model-size evaluator sensitivity\u003cbr\u003eEvaluator capability and model size affect susceptibility to in-context reward hacking.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.14\u003c\u002fb\u003e: Evaluator-capability monitoring\u003cbr\u003eMonitoring accounts for differences between easy hacks detectable by ordinary evaluators and subtle hacks requiring stronger evaluators.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.15\u003c\u002fb\u003e: Evaluator-oracle score comparison\u003cbr\u003eEvaluator scores are compared with independent human-oracle scores to detect evaluation failure.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e","\u003cb\u003e13.16\u003c\u002fb\u003e: Reward-hacking concealment\u003cbr\u003eTraining against monitors can make reward hacking subtler and less observable.\u003cbr\u003e\u003ci\u003eDimension 13: Reward-Hack Detection Architecture\u003c\u002fi\u003e"],"marker":{"color":"#565656","size":9},"mode":"markers","name":"13: Reward-Hack Detection Architecture","x":{"dtype":"f8","bdata":"D7NmCUWU6b8Yr8EtOf\u002flvwAAAAAAAPA\u002fP1YMS2ZK6j9p9PB01Z\u002fYv7KpNGG3md4\u002frITVFBqR6D8uYutiXufmv2o9\u002fgOYON2\u002fuETrcSFE3r8YVUSAxzLivyIMDi560do\u002foCuck7iiyT8u8qPZOsPTP0XObFGA6Os\u002fhrPjevkH6b8="},"y":{"dtype":"f8","bdata":"Zxf7RL47zLy95d5pikfIvFILAkQEqdE8W++OisUEzTyZAoOb8S27vIveXFBJ48A800NR5q4dyzyNxUA5xkfJvL1IIYpnIMC8S4P9nQ20wLxYb48tMRbEvDSh0ZHdmb08uwsSsLFLrDzo+6fpMdC1PPBun5LXzc48j2kX+uOgy7w="},"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#AA0DFE","size":8,"symbol":"x"},"mode":"markers","name":"1: Production Signal Selection (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#85660D","size":8,"symbol":"x"},"mode":"markers","name":"11: Inference Serving Strategy (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#782AB6","size":8,"symbol":"x"},"mode":"markers","name":"12: Safety Constraint Strategy (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#1C8356","size":8,"symbol":"x"},"mode":"markers","name":"2: Off-Policy Evaluation Method (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#16FF32","size":8,"symbol":"x"},"mode":"markers","name":"3: Behavioral Verification Method (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#F7E1A0","size":8,"symbol":"x"},"mode":"markers","name":"5: Reward Construction Strategy (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"
