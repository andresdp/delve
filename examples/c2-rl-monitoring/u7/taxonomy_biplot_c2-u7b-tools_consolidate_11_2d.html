        <script charset="utf-8" src="https://cdn.plot.ly/plotly-4.0.0.min.js" integrity="sha256-FEYfO0yRyLtZCpnW0Dw/0DHKQO7Afrq3ml4+rBB818o=" crossorigin="anonymous"></script>                <div id="43787348-9d5f-4f1d-93f3-e150946796e4" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("43787348-9d5f-4f1d-93f3-e150946796e4")) {                    Plotly.newPlot(                        "43787348-9d5f-4f1d-93f3-e150946796e4",                        [{"hoverinfo":"skip","line":{"color":"#16FF32","width":3},"mode":"lines","showlegend":false,"x":[-1.0,1.0],"y":[-3.1225022567582546e-17,3.1225022567582546e-17],"type":"scatter"},{"hoverinfo":"skip","line":{"color":"#1CFFCE","width":3},"mode":"lines","showlegend":false,"x":[-1.8735013540549512e-16,1.8735013540549512e-16],"y":[-1.0,1.0],"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e20.1\u003c\u002fb\u003e: Multiple offline evaluation methods\u003cbr\u003eTriangulation across several offline evaluation methods instead of relying on one metric.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.2\u003c\u002fb\u003e: Behavior-policy baseline\u003cbr\u003eOffline evaluation benchmark derived from the policy that generated the observed data.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.3\u003c\u002fb\u003e: Subset traffic sampling\u003cbr\u003eSampling a subset of production traffic to control shadow-evaluation overhead.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.4\u003c\u002fb\u003e: Ground-truth test-case evaluation\u003cbr\u003eAssessment against known test cases where correctness can be directly established.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.5\u003c\u002fb\u003e: Evaluator-free assessment\u003cbr\u003eAssessment design for tasks whose correctness cannot be directly evaluated by an available evaluator.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.6\u003c\u002fb\u003e: Hint-based faithfulness protocol\u003cbr\u003eTesting whether models disclose reliance on injected correct or incorrect hints in their reasoning.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.7\u003c\u002fb\u003e: Multi-turn reward-hacking environment\u003cbr\u003eDeliberately eliciting reward hacking across realistic multi-turn interactions for systematic evaluation.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.8\u003c\u002fb\u003e: Adversarial reward-hacking evaluation\u003cbr\u003eUse red teams, adversarial agents, or scaled critiques to probe policies and reward models for exploitation.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.9\u003c\u002fb\u003e: Support-aware offline evaluation\u003cbr\u003eCheck whether offline evaluation data adequately represents situations in which the policy may be deployed.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.10\u003c\u002fb\u003e: Counterfactual policy evaluation\u003cbr\u003eEvaluate alternative policy decisions from historical interactions without exploratory production actions.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.11\u003c\u002fb\u003e: Score-only performance evaluation\u003cbr\u003eUse reward scores alone as evidence of acceptable agent performance.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.12\u003c\u002fb\u003e: LLM-grader evaluation\u003cbr\u003eUse language models to grade difficult-to-verify outputs and provide evaluation feedback.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.13\u003c\u002fb\u003e: Offline-only evaluation without on-policy interaction\u003cbr\u003eOn-policy evaluation is rejected when evaluation must remain entirely offline.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.14\u003c\u002fb\u003e: Production A\u002fB policy evaluation\u003cbr\u003eCompare a candidate policy with the existing production model under controlled live traffic.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.15\u003c\u002fb\u003e: Multiple-evidence evaluator calibration\u003cbr\u003eCalibrates model-based evaluation using textual evidence before scoring outputs.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.16\u003c\u002fb\u003e: Position-balanced score aggregation\u003cbr\u003eAggregates evaluation results across response orders to reduce positional bias.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.17\u003c\u002fb\u003e: Entropy-based evaluation difficulty routing\u003cbr\u003eUses evaluator uncertainty to select difficult cases for human assistance.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.18\u003c\u002fb\u003e: Agentic evaluation scaffolds\u003cbr\u003eWhich execution context should evaluation use to expose agent behavior?\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.19\u003c\u002fb\u003e: Unfaithful answer behavior\u003cbr\u003eFailure to disclose information used to generate an answer despite the evaluation requiring such disclosure.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.20\u003c\u002fb\u003e: Evaluator fidelity and bias risk\u003cbr\u003eLLM-based grading can diverge from oracle judgment and depend on model family or response ordering.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e","\u003cb\u003e20.21\u003c\u002fb\u003e: Evaluation-aware model behavior\u003cbr\u003eAgents may adapt behavior to evaluator mechanisms rather than performing the intended task.\u003cbr\u003e\u003ci\u003eDimension 20: Evaluation Method Selection\u003c\u002fi\u003e"],"marker":{"color":"#16FF32","size":9},"mode":"markers","name":"20: Evaluation Method Selection","x":{"dtype":"f8","bdata":"jPqgGYqG3L+10UgpBSbtv0Trqm6p9Om\u002fScG65UGJ0T840khwaG7bPyl1ylzBc+I\u002f6ph+RZzI0T84EBVKXYfRPy+L1VoRMuy\u002fsEp7IuzN7L+AuwwNGm7ZP6Jfeoj19Ow\u002fXMLBVX4v6r8AAAAAAADwvz3kh1Q08+I\u002foIw3wOKw2j820gpqWxzdPzTbbEGJ88g\u002fhEDZet\u002f85j\u002fUFilqJTzvPwzzpSdxJ9U\u002f"},"y":{"dtype":"f8","bdata":"8Yxqrq0LcLz59TjnYmWAvLFIgJw+M328dRlyImq6YzyE7FF+NdxuPNLDY4g5wnQ8C2wuzq8BZDxCslfzSLhjPJo8MIZTuH+8Blpl09QzgLz1Uq5O3ZtsPM7VxBzKSYA8rPp5IG51fbwDAAAAAACCvMjgGN+aUXU8OX4+GP8GbjxBFqZr819wPJ92mmn6EVw8mWg0anvceTzaHLcL1ZGBPHGxmkxfzGc8"},"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e9.1\u003c\u002fb\u003e: Canary threshold control\u003cbr\u003ePredefined thresholds that limit exposure during controlled policy rollout.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.2\u003c\u002fb\u003e: Policy-version traffic slicing\u003cbr\u003eIdentification and isolation of affected policy versions and production traffic segments.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.3\u003c\u002fb\u003e: Safe fallback policy switching\u003cbr\u003eRedirecting traffic to a safe fallback or behavior policy during incidents.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.4\u003c\u002fb\u003e: Affected-period data freeze\u003cbr\u003eFreezing ingestion of potentially contaminated or disputed data during incident investigation.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.5\u003c\u002fb\u003e: Safe-exploration infrastructure\u003cbr\u003eControls and infrastructure that limit harm while agents learn through real-world interaction.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.6\u003c\u002fb\u003e: Automated policy rollback\u003cbr\u003eAutomatically return to a stable model or policy when monitoring detects severe production regressions or safety failures.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.7\u003c\u002fb\u003e: Canary and shadow release control\u003cbr\u003eExpose candidate policies to limited or non-impacting traffic before full production rollout.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.8\u003c\u002fb\u003e: Fail-safe degradation and action gating\u003cbr\u003eDegrade gracefully or gate unsafe actions when policies, features, or environments behave unexpectedly.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.9\u003c\u002fb\u003e: Chaos and game-day validation\u003cbr\u003eExercise logging, feature, drift, and data-integrity dependencies before or during production operation.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.10\u003c\u002fb\u003e: Drift-sensitive error-budget control\u003cbr\u003eRestrict policy deployment cadence using conservative error budgets when production drift risk is high.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.11\u003c\u002fb\u003e: Runtime out-of-distribution monitoring\u003cbr\u003eDetect deployment observations or conditions outside modeled and evaluated distributions before unsafe actions occur.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.12\u003c\u002fb\u003e: Adaptive action shielding\u003cbr\u003eAdaptively intervene between policy output and execution when distribution shifts or unsafe conditions are detected.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.13\u003c\u002fb\u003e: Safe action gate\u003cbr\u003eRoute policy outputs through a final gate that blocks unsafe actions before execution.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.14\u003c\u002fb\u003e: Layered safety controls\u003cbr\u003eCombine complementary safety mechanisms rather than relying on one constraint family under distribution shift.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.15\u003c\u002fb\u003e: Conservative policy learning\u003cbr\u003ePrefer policies that remain safer under deployment shifts rather than optimizing only average return.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.16\u003c\u002fb\u003e: Explicit uncertainty modeling\u003cbr\u003eRepresent policy and cost uncertainty explicitly to support safer runtime decisions under shift.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.17\u003c\u002fb\u003e: Input-output safety filtering\u003cbr\u003eBlock harmful inputs and sanitize unsafe outputs before they reach users.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.18\u003c\u002fb\u003e: Observed-state-only safety constraints\u003cbr\u003eSafety constraints limited to visible state variables are rejected when hidden risk variables can change.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.19\u003c\u002fb\u003e: Fixed hidden-regime safety assumption\u003cbr\u003eAssuming hidden environmental and system parameters remain fixed is rejected for deployment safety.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.20\u003c\u002fb\u003e: Classical multiplier-based safety constraints\u003cbr\u003eClassical primal-dual or Lagrangian constraint handling is rejected for fast distribution shifts.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.21\u003c\u002fb\u003e: Novelty-as-danger decision rule\u003cbr\u003eTreating every novel situation as dangerous is rejected because agents may safely generalize to some novel situations.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.22\u003c\u002fb\u003e: Inference-time missing-feature fallback\u003cbr\u003eFallback defaults, imputation, and robust policy logic handle missing required features during deployment.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.23\u003c\u002fb\u003e: Separated model-runtime ownership\u003cbr\u003eAssigns model and runtime accountability to distinct teams for incident response.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.24\u003c\u002fb\u003e: Incident runbooks and escalation playbooks\u003cbr\u003eUses predefined runbooks for known incidents and coordinated playbooks for complex incidents.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.25\u003c\u002fb\u003e: Irrational outputs under novel observations\u003cbr\u003eMonitor and control unsafe or over-confident actions caused by observations outside training support.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.26\u003c\u002fb\u003e: Observation manipulation\u003cbr\u003eAgent manipulates sensors or observations so monitoring receives a misleading environment state.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.27\u003c\u002fb\u003e: Lagging violation signal under distribution shift\u003cbr\u003eDelayed violation-triggered signals are an adverse deployment outcome when safety control reacts after unfamiliar conditions arise.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.28\u003c\u002fb\u003e: Cost-estimator bias under regime change\u003cbr\u003eRegime changes can bias estimated safety costs and drive constraint updates in the wrong direction.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.29\u003c\u002fb\u003e: Estimated–true risk divergence\u003cbr\u003eHidden-parameter changes can make estimated risk diverge from true risk, allowing unsafe constraints to pass.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.30\u003c\u002fb\u003e: Unsafe shield approval under shift\u003cbr\u003eOutdated shielding assumptions can approve unsafe actions after distribution shift.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e","\u003cb\u003e9.31\u003c\u002fb\u003e: Safe-action shield overblocking\u003cbr\u003eChanged dynamics can cause a shield to block actions that are actually safe.\u003cbr\u003e\u003ci\u003eDimension 9: Rollout and Incident Control\u003c\u002fi\u003e"],"marker":{"color":"#1CFFCE","size":9},"mode":"markers","name":"9: Rollout and Incident Control","x":{"dtype":"f8","bdata":"PLVh7cJpmDzkF3uAzBOjPEHWyrW0RZM8\u002fSjnBvHomzyizSMTk+mZvErykzsxyqA8l+NAAmyKmjxpij4cDqaRvGVkJAiLyqE8gU8xCZRbmzzprCJHpyCMPNbQZ06yU5e8j74zMYD1orzT\u002fyUNQYqbvJ2BDiQkq5
