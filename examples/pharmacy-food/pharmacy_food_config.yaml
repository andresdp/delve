# Delve Configuration — Pharmacy Food Architecture Decisions
# ──────────────────────────────────────────────
# Use with: python main.py --corpus examples/pharmacy-food/pharmacy_food_architecture_decisions.json --config examples/pharmacy-food/pharmacy_food_config.yaml --output examples/pharmacy-food/

models:
  model: "openai/gpt-5.4-nano"
  fast_llm: "openai/gpt-5.4-nano"

pipeline:
  max_runs: 0
  sample_size: 0
  batch_size: 8
  random_seed: 42

taxonomy:
  name: "pharmacy-food"
  max_num_clusters: null  # Let the LLM determine the number of dimensions from the data
  cluster_name_length: 10
  cluster_description_length: 30
  suggestion_length: 30
  explanation_length: 20
  use_case: >-
    Classify software architecture design decisions for a tech-enabled
    healthy food startup operating a "ghost kitchen" model. The platform
    lets users browse available items, purchase meals, and pick them up at
    any point of sale. The startup's mission is to make healthy,
    dietary-aware meals radically affordable and accessible. Long-term
    goals include supporting multiple third-party vendors offering items
    through shared points of sale, and harvesting user data (health goals,
    purchase history, item ratings) to provide personalized meal
    recommendations. Identify the orthogonal dimensions of architectural
    variation along which these decisions differ — each dimension should
    capture a fundamentally different type of architectural concern (e.g.,
    multi-vendor marketplace integration, point-of-sale synchronization,
    real-time inventory visibility, personalized recommendation pipeline,
    payment and checkout strategy, user profile and health data
    management, data collection and analytics approach). Each decision
    belongs to the dimension whose axis of variation best describes its
    fundamental architectural intent.

summarization:
  skip: false
  summary_length: 20
  explanation_length: 30
  max_concurrency: 5

labeling:
  fallback_category: "Other"
  review_sample_size: 15

output:
  max_displayed_documents: 26
  max_docs_per_category_tree: 5
  content_preview_length: 120
  default_output_dir: "output"
  graph_filename: "graph.png"