        <script charset="utf-8" src="https://cdn.plot.ly/plotly-4.0.0.min.js" integrity="sha256-FEYfO0yRyLtZCpnW0Dw/0DHKQO7Afrq3ml4+rBB818o=" crossorigin="anonymous"></script>                <div id="d6ff116b-d304-4624-af65-d432b5468c46" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("d6ff116b-d304-4624-af65-d432b5468c46")) {                    Plotly.newPlot(                        "d6ff116b-d304-4624-af65-d432b5468c46",                        [{"hoverinfo":"skip","line":{"color":"#3283FE","width":3},"mode":"lines","showlegend":false,"x":[-1.0,1.0],"y":[-1.6098233857064776e-14,1.6098233857064776e-14],"type":"scatter"},{"hoverinfo":"skip","line":{"color":"#F6222E","width":3},"mode":"lines","showlegend":false,"x":[1.632027846198981e-14,-1.632027846198981e-14],"y":[-1.0,1.0],"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e12.1\u003c\u002fb\u003e: Scalar configuration and maintenance\u003cbr\u003eUses Scalar to apply recommended configuration and run background maintenance that accelerates Git workflows.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.2\u003c\u002fb\u003e: Reduced Scalar scope\u003cbr\u003eLimits Scalar to currently needed performance capabilities rather than expanding its management role.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.3\u003c\u002fb\u003e: Transitional Scalar layer\u003cbr\u003eUses Scalar temporarily while Git develops capabilities that can eventually replace it.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.4\u003c\u002fb\u003e: Git-native Scalar replacement\u003cbr\u003eContributes Scalar-driven management features to Git so external layers can be removed over time.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.5\u003c\u002fb\u003e: User-controlled maintenance suspension\u003cbr\u003eUsers can pause or unregister background repository maintenance.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.6\u003c\u002fb\u003e: Repository-local maintenance logging\u003cbr\u003eMaintenance activity and durations are recorded in the repository for user visibility.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.7\u003c\u002fb\u003e: Scalar repository registration\u003cbr\u003eRepositories are explicitly activated with Scalar before it applies repository-specific configuration and maintenance.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.8\u003c\u002fb\u003e: Repository-local Git configuration\u003cbr\u003eScalar stores client behavior settings in the repository's local Git configuration.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.9\u003c\u002fb\u003e: Background scheduled fetching\u003cbr\u003eFetch remote objects periodically in the background while keeping user-visible remote references unchanged.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.10\u003c\u002fb\u003e: Hidden remote-reference namespace\u003cbr\u003eStore background-fetch references outside the visible remote-reference namespace for maintenance use.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.11\u003c\u002fb\u003e: Foreground-only remote-reference updates\u003cbr\u003eRequire foreground fetches when users need visible remote-reference updates.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.12\u003c\u002fb\u003e: Background repository configuration updates\u003cbr\u003eApply recommended repository configuration changes asynchronously after installation.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.13\u003c\u002fb\u003e: Custom Git distribution for Scalar\u003cbr\u003eScalar is shipped within a custom Git distribution while broader fork compatibility is pursued.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e","\u003cb\u003e12.14\u003c\u002fb\u003e: Compatibility-driven default-off optimization features\u003cbr\u003eAdvanced performance features remain disabled by default to preserve broad compatibility.\u003cbr\u003e\u003ci\u003eDimension 12: Client Repository Management Strategy\u003c\u002fi\u003e"],"marker":{"color":"#3283FE","size":9},"mode":"markers","name":"12: Client Repository Management Strategy","x":{"dtype":"f8","bdata":"WYnJi76b5r\u002f9KccOPXPkv1849W9Jmeu\u002fw5CpmYoI678aNMIks3PnPwKUCGIpx+I\u002fdtZP2jLB37\u002fv1eFlEHrjvzD4B9yxBO4\u002f7I+rkzsw7T8AAAAAAADwP0ZZxUtiMd4\u002fKY5WgvwK7r\u002fcnV269RvdPw=="},"y":{"dtype":"f8","bdata":"mk1a2m2cCb2Tnb0qiyoHvd\u002fJ0zClQw+9ABYSAq2fDr0I\u002f6PvEJEKPa23DeGcRQU9ezinzW38Ab1b1GmTRhAGvZWDoL2oABE9hiykvlGIED0CAAAAACASPZPH6qz4GQE9hwbTBTkEEb1rBo8u1nwAPQ=="},"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e7.1\u003c\u002fb\u003e: Incremental small-batch repacking\u003cbr\u003eRewrites bounded batches of small packfiles instead of attempting unlimited or repository-wide repacking.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.2\u003c\u002fb\u003e: Multi-pack-index object relocation\u003cbr\u003eUses the multi-pack-index to redirect objects into newly created packs while avoiding reads from superseded packs.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.3\u003c\u002fb\u003e: Two-phase consolidation and expiration\u003cbr\u003eSeparates pack creation and reference updates from deletion so cleanup occurs only after old packs are unreferenced.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.4\u003c\u002fb\u003e: Deferred unreferenced-pack deletion\u003cbr\u003eRetains old packs until their objects have been redirected and no references remain.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.5\u003c\u002fb\u003e: Foreground-command continuity\u003cbr\u003eDesigns maintenance so foreground Git commands continue operating during repacking and expiration.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.6\u003c\u002fb\u003e: Loose-object cleanup\u003cbr\u003eMaintenance removes accumulated loose objects to reduce storage and lookup overhead.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.7\u003c\u002fb\u003e: Single-pack full repacking\u003cbr\u003eAll repository data is rewritten into one packfile to reduce lookup overhead.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.8\u003c\u002fb\u003e: Background incremental repository maintenance\u003cbr\u003ePerform repository cleanup and rewriting incrementally in background processes rather than blocking foreground commands.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.9\u003c\u002fb\u003e: Foreground automatic garbage collection\u003cbr\u003eRun complete automatic garbage collection synchronously at the end of user commands.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.10\u003c\u002fb\u003e: Primary-only compaction scheduling\u003cbr\u003eSchedule repository compaction on only the primary replica and propagate its results to peers.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.11\u003c\u002fb\u003e: WAL-propagated compaction events\u003cbr\u003ePropagate compaction results through the WAL so replicas apply the same repository maintenance events.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.12\u003c\u002fb\u003e: S3 distribution of compacted packs\u003cbr\u003eDistribute already-compacted packs from object storage instead of repacking independently on replicas.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.13\u003c\u002fb\u003e: Periodic write-ahead-log compaction\u003cbr\u003eCompact the WAL periodically to bound restoration work as updates accumulate.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.14\u003c\u002fb\u003e: On-disk layout optimization for compaction\u003cbr\u003eOptimize repository disk layout to reduce compaction impact on ingestion.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.15\u003c\u002fb\u003e: Replica-local repository repacking\u003cbr\u003eRepack repositories independently on each replica.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.16\u003c\u002fb\u003e: Automatic Git garbage-collection disablement\u003cbr\u003eDisable foreground automatic garbage collection and shift cleanup to background maintenance.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.17\u003c\u002fb\u003e: Unbounded packfile growth\u003cbr\u003eAllows pack counts to grow without bound, creating file-handle scalability problems.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.18\u003c\u002fb\u003e: Pack-count and storage reduction\u003cbr\u003eDeployment reduced repositories from thousands of packs and 150–200 GB to fewer than 100 packs and 30–50 GB.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.19\u003c\u002fb\u003e: Pack-index accumulation lookup cost\u003cbr\u003eAccumulating packfiles increases the number of indexes Git must inspect and slows object lookup.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.20\u003c\u002fb\u003e: Foreground garbage-collection blocking\u003cbr\u003eForeground garbage collection blocks commands and can exhaust CPU and memory during repository rewrites.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.21\u003c\u002fb\u003e: Performance decay from disabled automatic collection\u003cbr\u003eAvoid foreground collection but allow accumulated objects to gradually degrade Git performance.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.22\u003c\u002fb\u003e: Compaction-limited push throughput\u003cbr\u003ePush throughput becomes bounded by on-disk compaction speed after WAL latency is reduced.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e","\u003cb\u003e7.23\u003c\u002fb\u003e: Replica failover from concurrent maintenance\u003cbr\u003eConcurrent compaction on replicas can trigger repository failover and reduce availability.\u003cbr\u003e\u003ci\u003eDimension 7: Packfile Lifecycle Management\u003c\u002fi\u003e"],"marker":{"color":"#F6222E","size":9},"mode":"markers","name":"7: Packfile Lifecycle Management","x":{"dtype":"f8","bdata":"mx5XD\u002fW6Az0sRAd67qcMPYA0\u002fwoD6gE9SSv87uELAj2T+UICAjQEvVGfHfXE5Pm8N+2jwncFCz1VL+DS1LYFvRC\u002fyzQisxG96KJFAkYz6zy1LxQgtIT0vLQagExmgwo9Cc\u002fNtaHM+bwOSWNUpJz2PPTJ11fa
