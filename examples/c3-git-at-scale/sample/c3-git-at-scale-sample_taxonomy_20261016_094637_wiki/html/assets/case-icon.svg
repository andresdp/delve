<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="C3 Git at scale" width="32" height="32">
  <title>C3: Git at scale</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D3461"/><stop offset="1" stop-color="#0D1830"/></linearGradient></defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <!-- commit graph: main line, a branch and a merge -->
  <line x1="40" y1="70" x2="216" y2="70" stroke="#2EC4B6" stroke-width="6" stroke-linecap="round"/>
  <path d="M80,70 C96,70 96,104 116,104 L156,104 C176,104 176,70 192,70" fill="none" stroke="#FFB703" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#13254A" stroke-width="2.5">
    <circle cx="44" cy="70" r="8" fill="#2EC4B6"/><circle cx="80" cy="70" r="8" fill="#2EC4B6"/><circle cx="136" cy="70" r="8" fill="#2EC4B6"/>
    <circle cx="116" cy="104" r="8" fill="#FFB703"/><circle cx="156" cy="104" r="8" fill="#FFB703"/>
    <circle cx="192" cy="70" r="10" fill="#FF6B6B"/>
  </g>
  <!-- replicas -->
  <g stroke="#13254A" stroke-width="2">
    <rect x="64" y="128" width="128" height="16" rx="5" fill="#EEF3FB"/>
    <rect x="64" y="147" width="128" height="16" rx="5" fill="#B7C6DE"/>
    <rect x="64" y="166" width="128" height="16" rx="5" fill="#8EA3C7"/>
  </g>
  <g fill="#2EC4B6"><circle cx="78" cy="136" r="3.5"/><circle cx="78" cy="155" r="3.5"/><circle cx="78" cy="174" r="3.5"/></g>
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 4"><line x1="192" y1="80" x2="176" y2="126"/></g>
  <text x="128" y="214" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#EEF3FB">C3</text>
  <text x="128" y="236" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#A9B8D2">Git at scale</text>
</svg>
