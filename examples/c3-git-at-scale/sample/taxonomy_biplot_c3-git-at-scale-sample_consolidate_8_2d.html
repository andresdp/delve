        <script charset="utf-8" src="https://cdn.plot.ly/plotly-4.0.0.min.js" integrity="sha256-FEYfO0yRyLtZCpnW0Dw/0DHKQO7Afrq3ml4+rBB818o=" crossorigin="anonymous"></script>                <div id="3b96557d-18c6-47f7-b00e-eb4937b8f383" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("3b96557d-18c6-47f7-b00e-eb4937b8f383")) {                    Plotly.newPlot(                        "3b96557d-18c6-47f7-b00e-eb4937b8f383",                        [{"hoverinfo":"skip","line":{"color":"#90AD1C","width":3},"mode":"lines","showlegend":false,"x":[-1.0,1.0],"y":[-4.9960036108132e-16,4.9960036108132e-16],"type":"scatter"},{"hoverinfo":"skip","line":{"color":"#B00068","width":3},"mode":"lines","showlegend":false,"x":[6.106226635438353e-16,-6.106226635438353e-16],"y":[-1.0,1.0],"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e30.1\u003c\u002fb\u003e: Strict-majority coordinated writes\u003cbr\u003eUses three replicas, majority-held exclusive locks, strict-majority acceptance, and replica-wide serialization to prevent conflicting divergent writes.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.2\u003c\u002fb\u003e: Three-phase commit coordination\u003cbr\u003eReplicas synchronize reference updates through coordinator-directed prepare, commit, and rollback phases.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.3\u003c\u002fb\u003e: Transactional Git reference updates\u003cbr\u003eGit reference mutations use atomic, validated transactions that produce deterministic results and roll back completely on failure.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.4\u003c\u002fb\u003e: Consensus-free write acceptance\u003cbr\u003eAny repository instance may accept writes, using storage-level atomic updates instead of elected consensus primaries.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.5\u003c\u002fb\u003e: Per-write voting without a primary\u003cbr\u003eEach write directly determines its winning order and outcome rather than following a primary's global ordering.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.6\u003c\u002fb\u003e: Rollback of non-majority writes\u003cbr\u003eWrites failing majority agreement are reverted where applied to preserve surviving replica agreement.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.7\u003c\u002fb\u003e: Consistency-and-partition-tolerance priority\u003cbr\u003eReplica write coordination prioritizes consistency and partition tolerance over write availability.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.8\u003c\u002fb\u003e: Replica-based distributed locking\u003cbr\u003eReplicas provide distributed locks that order coordinated database updates.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.9\u003c\u002fb\u003e: Overlapped replica-coordination work\u003cbr\u003eThe coordinator performs database, checksum, and lock work concurrently while replica communication is in flight.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.10\u003c\u002fb\u003e: Durability-gated write acceptance\u003cbr\u003eWrites are accepted only after the required number of replicas have synchronously committed them.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.11\u003c\u002fb\u003e: Orchestrated push fan-out\u003cbr\u003eAn orchestrator distributes pushed packfiles and reference transactions to repository instances.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.12\u003c\u002fb\u003e: Unsynchronized packfile distribution\u003cbr\u003ePushed packfiles fan out without consensus because they are unreachable until references commit.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.13\u003c\u002fb\u003e: Single-local-repository synchronization\u003cbr\u003eReference transactions synchronize with one local repository rather than a replica quorum.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.14\u003c\u002fb\u003e: Read-preserving replicated-write optimization\u003cbr\u003eReplication write acceleration is designed without degrading the much more frequent repository reads.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.15\u003c\u002fb\u003e: Replica-distance reference-update limit\u003cbr\u003eGeographic replica latency bounds sustainable per-repository reference-update throughput.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.16\u003c\u002fb\u003e: Reference-update amplification\u003cbr\u003ePull-request bookkeeping can multiply one user push into many additional replicated reference updates.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.17\u003c\u002fb\u003e: Slowest-replica consensus latency\u003cbr\u003eCoordinated replication latency is bounded by the slowest participating replica.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.18\u003c\u002fb\u003e: Replica-count push-throughput degradation\u003cbr\u003eAdding replicas reduces push throughput because consensus waits on more participants and their tail latency.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.19\u003c\u002fb\u003e: Replica round-trip coordination latency\u003cbr\u003eMultiple distant-replica round trips consume the write-coordination latency budget.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e","\u003cb\u003e30.20\u003c\u002fb\u003e: Write unavailability during replication shortfall\u003cbr\u003eWrites become temporarily unavailable when the required replica count cannot be synchronously achieved.\u003cbr\u003e\u003ci\u003eDimension 30: Replica Write Coordination\u003c\u002fi\u003e"],"marker":{"color":"#90AD1C","size":9},"mode":"markers","name":"30: Replica Write Coordination","x":{"dtype":"f8","bdata":"B7Vfae5H2L++T\u002f6kTwzEv7ygxTrsSuw\u002fruvlNtVq2D+etyR9KK7bP065tNazmcy\u002fNuHK\u002frad47842XoQqhrcv32ED8WJZue\u002ftnw\u002fUsbv3L8AAAAAAADwP\u002fPmquhH6u0\u002fiX5qyFHx4j\u002fOj3StxkDEP+DnAP5q\u002fsa\u002fJxdv9J7+7D\u002fd5AFsnXLrvy6mTNdPA9i\u002fIWEUp9TA7L+Sxc7RYqnivw=="},"y":{"dtype":"f8","bdata":"oquLNuxQq7yxGZ6Z2Y2WvMxUHsJJ1L88HqnC3S94qzyLTsmM7SOvPDioxSh1FqC8WD2k3m0RtrxYNIpS\u002f52vvAd1sf1aU7q8I7ZDjt9GsLz8\u002f\u002f\u002f\u002f\u002f\u002f\u002fBPOUh4HLI08A8Vc53AXxPtTzDISOD38iWPNYEwV043pm8An1+aTlPwDxyIYIZ8eC+vO46NtK5A6u8n3b7nXcswLxAnggsj\u002f60vA=="},"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e9.1\u003c\u002fb\u003e: Integrated client optimization configuration\u003cbr\u003eA managed client setup combines configuration, metadata acceleration, filesystem monitoring, fetching, and background maintenance for large repositories.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.2\u003c\u002fb\u003e: Native Git scalability improvements\u003cbr\u003eLarge-repository performance is improved in Git itself through features such as commit graphs and sparse-checkout enhancements.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.3\u003c\u002fb\u003e: Repository performance tracing\u003cbr\u003eClient and repository performance bottlenecks are identified through custom tracing and analysis of user feedback.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.4\u003c\u002fb\u003e: Custom Git client extensions\u003cbr\u003eRequire a specialized Git client version to deliver repository-scale client performance features.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.5\u003c\u002fb\u003e: Background client maintenance\u003cbr\u003eRun repository maintenance asynchronously and incrementally so interactive Git commands avoid expensive foreground work.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.6\u003c\u002fb\u003e: Git-integrated filesystem watching\u003cbr\u003eGit uses a watcher that understands repository semantics such as ignore rules to avoid unnecessary scans.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.7\u003c\u002fb\u003e: Parallel checkout processing\u003cbr\u003eCheckout work is processed in parallel to address checkout becoming a bottleneck after virtualization removal.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.8\u003c\u002fb\u003e: Core Git capability consolidation\u003cbr\u003eCapabilities formerly supplied by Scalar or management layers are incorporated into core Git, reducing specialized client-layer dependence.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.9\u003c\u002fb\u003e: Virtualized filesystem client\u003cbr\u003eA virtualized filesystem defers populated-size costs to improve large-repository client performance.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.10\u003c\u002fb\u003e: Foreground garbage collection\u003cbr\u003eThe client periodically performs garbage collection in the foreground during ordinary user work.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.11\u003c\u002fb\u003e: Scalar interim performance layer\u003cbr\u003eScalar supplies needed client performance temporarily while equivalent capabilities move into core Git.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.12\u003c\u002fb\u003e: Persistent Scalar dependency\u003cbr\u003eScalar remains a required long-term layer above Git for repository-scale client performance.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.13\u003c\u002fb\u003e: Working-directory inspection by core commands\u003cbr\u003eCore Git commands inspect on-disk working-directory state as part of repository operations.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.14\u003c\u002fb\u003e: Complete tracked-path index\u003cbr\u003eThe client index records every tracked path to support core command state inspection.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.15\u003c\u002fb\u003e: Updated large-index file format\u003cbr\u003eAn updated index representation reduces I\u002fO and storage for millions of tracked entries.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.16\u003c\u002fb\u003e: Untracked cache\u003cbr\u003eGit caches untracked-directory information to reduce large-repository inspection work.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.17\u003c\u002fb\u003e: Single-file index stream I\u002fO\u003cbr\u003eIndex data is streamed through one file with cost dominated by sequential file I\u002fO.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.18\u003c\u002fb\u003e: Hourly background repository fetch\u003cbr\u003eBackground fetches keep local objects current without placing download work in foreground commands.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.19\u003c\u002fb\u003e: Hidden remote-reference namespace\u003cbr\u003eFetched remote refs are kept under a hidden namespace for maintenance without changing visible refs.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.20\u003c\u002fb\u003e: Background split commit-graph maintenance\u003cbr\u003eReachable commits are maintained asynchronously in incremental split commit-graph layers.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.21\u003c\u002fb\u003e: Preserved visible branch references during background fetch\u003cbr\u003eBackground fetching updates objects while leaving local and visible remote-tracking branches unchanged.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.22\u003c\u002fb\u003e: Reachability-based commit-graph coverage\u003cbr\u003eBackground graph generation includes every commit reachable through visible and hidden references.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.23\u003c\u002fb\u003e: Consolidated client maintenance command\u003cbr\u003eA single foreground command runs the repository maintenance steps together.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.24\u003c\u002fb\u003e: Automatic repository registration\u003cbr\u003eNewly cloned repositories are automatically registered for recommended configuration and ongoing maintenance.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.25\u003c\u002fb\u003e: Foreground maintenance command blocking\u003cbr\u003eSynchronous garbage collection delays ordinary interactive Git commands.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.26\u003c\u002fb\u003e: System-wide rewrite resource exhaustion\u003cbr\u003eLarge synchronous repository rewrites can consume CPU and memory and stall the entire client system.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.27\u003c\u002fb\u003e: Performance decay from deferred cleanup\u003cbr\u003eDisabling automatic cleanup without effective background maintenance causes object accumulation and gradual performance deterioration.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.28\u003c\u002fb\u003e: Checkout slowdown after virtualization removal\u003cbr\u003eSparse-checkout introduces slower checkout than virtualization because populated-size costs are no longer deferred.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.29\u003c\u002fb\u003e: Multi-million-entry index\u003cbr\u003eThe client supports an index containing more than three million tracked entries.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.30\u003c\u002fb\u003e: Index compression from 400 MB to 250 MB\u003cbr\u003eThe updated index format reduces the stored index size and corresponding command I\u002fO.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.31\u003c\u002fb\u003e: Foreground-fetch overhead\u003cbr\u003eGenerating commit-graph data during foreground fetch adds user-visible fetch work.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.32\u003c\u002fb\u003e: Low average index-entry processing time\u003cbr\u003eLarge-index commands retain low per-entry processing cost because streaming I\u002fO dominates.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e","\u003cb\u003e9.33\u003c\u002fb\u003e: Compatibility-driven default-off performance features\u003cbr\u003eAdvanced performance features remain disabled by default to preserve broad compatibility.\u003cbr\u003e\u003ci\u003eDimension 9: Client Repository Performance Strategy\u003c\u002fi\u003e"],"marker":{"color":"#B00068","size":9},"mode":"markers","name":"9: Client Repository Performance Strategy","x":{"dtype":"f8","bdata":"+9JPdptTnjwcUewubJ2xvBN4JI\u002fPmJ88mjPiYZUbtLxV5Z3aO\u002fq5vCekMkuzLLK81VQvSWl5o7yrVmaQ24qzvKMp5l5us6w8iMNVRiU4qrzJy1CeB+euvKhGCH4wnrK8CwM+owDhrbwKJHJXGTe8PGhUM\u002fEaEcU8ixDRIjWNpLz4\u002f\u002f\u002f\u002f\u002f\u002f\u002fFPCT7uhNUCrK8A\u002f2c8R31prwYOoEVdlKyvPWaYpKBjrK8INJ+7y95sLxDyesGGgmwvI6rkjIk+6683i8ZF5irubzSAJkqkKGiPAM7hujObKO8tdDggQYuoDxbGbfsJE7CPHPNXvBjW8Q8ktR9vilMrrzt8l8zoQbEPMpPCcsNO6Q8"},"y":{"dtype":"f8","bdata":"HCWXhEIOxr+mAW\u002f+KJ\u002fZP1xXYH\u002fF+sa\u002f6pB362Q\u002f3T9FeP6eiOTiP87uYG2Qb9o\u002fb3vQ3oFTzD+OT2ZG4mzcP37YeBaW39S\u002fO474eI8R0z89lIDneXnWP7gJDKCjFNs\u002fEEjnMOm61T+y6\u002fWzKYXkv9F6kEeEpO6\u002fGxgwYarkzT8AAAAAAADwv\u002fj4D5GRPdo\u002fCLigUkSy0D\u002fQa402fabaP+Kypr3T\u002fdo\u002fTr3PLRf21z+BDbSVDlPXP4dlU1MaiNY\u002fS\u002fSdVler4j\u002fejN7gixnLv+BVIPUsQcw\u002fVhikpcOIx7+8ame1NaDqv2xZW0Y0nO2\u002f\u002fg6KitgI1j96vkV56iDtv7z\u002f3lUrbc2\u002f"},"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#AA0DFE","size":8,"symbol":"x"},"mode":"markers","name":"10: Repository Hosting Model
