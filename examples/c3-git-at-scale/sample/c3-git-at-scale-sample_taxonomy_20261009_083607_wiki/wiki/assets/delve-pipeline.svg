<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="DelveDSpace pipeline">
  <title>DelveDSpace pipeline: open coding, axial coding with critique until saturation, review, integration</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6672"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 12; }
      .t { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d2129; }
      .s { font: 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4a5160; }
      .agent { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .06em; }
      .ico { font: 17px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
      .lbl { font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5f6672; }
      .flow { stroke: #5f6672; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="360" rx="18" fill="#fbfaf7" stroke="#e3e0d8"/>

  <!-- row 1: the coding loop -->
  <rect class="box" x="20" y="34" width="170" height="96" fill="#eef1f6" stroke="#8ea3c7"/>
  <text class="ico" x="32" y="58">📂</text>
  <text class="t" x="105" y="66" text-anchor="middle">Corpus</text>
  <text class="s" x="105" y="88" text-anchor="middle">sources → passages</text>
  <text class="s" x="105" y="106" text-anchor="middle">→ minibatches</text>

  <rect class="box" x="235" y="34" width="180" height="96" fill="#e6f7f5" stroke="#2EC4B6"/>
  <text class="agent" x="325" y="54" text-anchor="middle" fill="#1f9d92">CODER</text>
  <text class="ico" x="247" y="58">🔬</text>
  <text class="t" x="325" y="78" text-anchor="middle">Open coding</text>
  <text class="s" x="325" y="98" text-anchor="middle">concepts as codes, with the</text>
  <text class="s" x="325" y="115" text-anchor="middle">source's stance</text>

  <rect class="box" x="460" y="34" width="190" height="96" fill="#fff6e0" stroke="#FFB703"/>
  <text class="agent" x="555" y="54" text-anchor="middle" fill="#b7791f">TAXONOMIST</text>
  <text class="ico" x="472" y="58">🧠</text>
  <text class="t" x="555" y="78" text-anchor="middle">Axial coding</text>
  <text class="s" x="555" y="98" text-anchor="middle">generate, then update the</text>
  <text class="s" x="555" y="115" text-anchor="middle">design space per batch</text>

  <rect class="box" x="695" y="34" width="185" height="96" fill="#ffecec" stroke="#FF6B6B"/>
  <text class="agent" x="787" y="54" text-anchor="middle" fill="#c53030">CRITIC</text>
  <text class="ico" x="707" y="58">📊</text>
  <text class="t" x="787" y="78" text-anchor="middle">Critique</text>
  <text class="s" x="787" y="98" text-anchor="middle">scoreboard + saturation</text>
  <text class="s" x="787" y="115" text-anchor="middle">check (read-only)</text>

  <line class="flow" x1="190" y1="82" x2="231" y2="82" marker-end="url(#arr)"/>
  <line class="flow" x1="415" y1="82" x2="456" y2="82" marker-end="url(#arr)"/>
  <line class="flow" x1="650" y1="82" x2="691" y2="82" marker-end="url(#arr)"/>
  <!-- feedback and loop -->
  <path class="flow" d="M740,32 C740,14 600,14 600,32" marker-end="url(#arr)" stroke-dasharray="5 4"/>
  <text class="lbl" x="670" y="13" text-anchor="middle">feedback</text>
  <path class="flow" d="M787,130 L787,160 L325,160 L325,134" marker-end="url(#arr)"/>
  <text class="lbl" x="556" y="153" text-anchor="middle">not saturated: next minibatch</text>

  <!-- row 2: finishing -->
  <path class="flow" d="M845,130 L845,206" marker-end="url(#arr)"/>
  <text class="lbl" x="836" y="184" text-anchor="end">saturated, or</text>
  <text class="lbl" x="836" y="198" text-anchor="end">all batches coded</text>

  <rect class="box" x="695" y="210" width="185" height="96" fill="#fff6e0" stroke="#FFB703"/>
  <text class="agent" x="787" y="230" text-anchor="middle" fill="#b7791f">TAXONOMIST</text>
  <text class="ico" x="707" y="234">🔍</text>
  <text class="t" x="787" y="254" text-anchor="middle">Review</text>
  <text class="s" x="787" y="274" text-anchor="middle">final revision of the</text>
  <text class="s" x="787" y="291" text-anchor="middle">whole design space</text>

  <rect class="box" x="400" y="210" width="250" height="96" fill="#e8f0fe" stroke="#4C8BF5"/>
  <text class="agent" x="525" y="230" text-anchor="middle" fill="#2b6cb0">INTEGRATOR</text>
  <text class="ico" x="412" y="234">🧲</text>
  <text class="t" x="525" y="254" text-anchor="middle">Selective coding</text>
  <text class="s" x="525" y="274" text-anchor="middle">merge · consolidate · link evidence</text>
  <text class="s" x="525" y="291" text-anchor="middle">select dimensions · label passages</text>

  <rect class="box" x="120" y="210" width="235" height="96" fill="#eef1f6" stroke="#8ea3c7"/>
  <text class="t" x="237" y="240" text-anchor="middle">Design space</text>
  <text class="s" x="237" y="262" text-anchor="middle">dimensions, values, statuses,</text>
  <text class="s" x="237" y="279" text-anchor="middle">relations, evidence</text>
  <text class="s" x="237" y="296" text-anchor="middle">→ reports and this wiki</text>

  <line class="flow" x1="695" y1="258" x2="654" y2="258" marker-end="url(#arr)"/>
  <line class="flow" x1="400" y1="258" x2="359" y2="258" marker-end="url(#arr)"/>
  <text class="lbl" x="525" y="336" text-anchor="middle">The Critic also scores the final view (observe-only: scores never steer the pipeline).</text>
</svg>
