        <script charset="utf-8" src="https://cdn.plot.ly/plotly-4.0.0.min.js" integrity="sha256-FEYfO0yRyLtZCpnW0Dw/0DHKQO7Afrq3ml4+rBB818o=" crossorigin="anonymous"></script>                <div id="9d9d7893-fc5d-4856-9e21-3532e7d07f69" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("9d9d7893-fc5d-4856-9e21-3532e7d07f69")) {                    Plotly.newPlot(                        "9d9d7893-fc5d-4856-9e21-3532e7d07f69",                        [{"hoverinfo":"skip","line":{"color":"#C075A6","width":3},"mode":"lines","showlegend":false,"x":[5.3384380249710287e-14,-5.3384380249710287e-14],"y":[-1.0,1.0],"type":"scatter"},{"hoverinfo":"skip","line":{"color":"#B00068","width":3},"mode":"lines","showlegend":false,"x":[-1.0,1.0],"y":[-5.3481524764365e-14,5.3481524764365e-14],"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e33.1\u003c\u002fb\u003e: Git compaction throughput bottleneck\u003cbr\u003eAt low WAL latency, local Git-data compaction becomes the throughput limiting factor.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.2\u003c\u002fb\u003e: Replica-wide concurrent compaction\u003cbr\u003eRuns compaction concurrently for the same repository on multiple replicas.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.3\u003c\u002fb\u003e: Compaction resource concentration\u003cbr\u003eConcentrates compaction CPU on the primary while increasing replica bandwidth consumption for compacted-pack distribution.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.4\u003c\u002fb\u003e: Pack-file handle pressure\u003cbr\u003eUnbounded pack-file accumulation exhausts client file-handle capacity and harms repository operation.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.5\u003c\u002fb\u003e: Reduced pack count and storage footprint\u003cbr\u003eIncremental maintenance reduces the number and total storage footprint of repository pack-files.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.6\u003c\u002fb\u003e: Periodic incremental repository compaction\u003cbr\u003eCompacts accumulated loose objects and pack-files incrementally or periodically to control storage and lookup costs.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.7\u003c\u002fb\u003e: Multi-pack-index guided compaction\u003cbr\u003eUses multi-pack indexes to preserve lookup and safely replace or expire packs without full repository repacking.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.8\u003c\u002fb\u003e: Primary-only repository compaction\u003cbr\u003eAssigns repository compaction to the primary replica while other replicas consume the resulting compacted data.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.9\u003c\u002fb\u003e: Replica-local repository repacking\u003cbr\u003ePerforms independent repository repacking on each replica rather than consuming a primary-produced compaction result.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e","\u003cb\u003e33.10\u003c\u002fb\u003e: Single-pack-file repacking\u003cbr\u003eRewrites all repository objects into one pack-file as a consolidated garbage-collection operation.\u003cbr\u003e\u003ci\u003eDimension 33: Repository Compaction Strategy\u003c\u002fi\u003e"],"marker":{"color":"#C075A6","size":9},"mode":"markers","name":"33: Repository Compaction Strategy","x":{"dtype":"f8","bdata":"Q9EwM9zOGj0UjKbTn\u002fctPY37Ld\u002f3JSc9BAAAAIANLr3zG5fH00YsvUQcM0r0fxO9uOX9vrjBIb2qb+GVyVspPSoix3CzViA9UvJmJ3xhJr0="},"y":{"dtype":"f8","bdata":"ruNB9ImL3L\u002f+Frr2tOjvv\u002fw9T+zwpei\u002fAAAAAAAA8D9MvT7k3RvuPw5fLWBow9Q\u002fp7fd8ULo4j+RNu4qbADrvxnInQe4ZeG\u002fDiGDCbrU5z8="},"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e35.1\u003c\u002fb\u003e: Globally consistent replica reads\u003cbr\u003eS3 validation and catch-up produce a consistent repository view even when replication notifications are delayed or lost.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.2\u003c\u002fb\u003e: Low-latency replica communication requirement\u003cbr\u003eRequiring nearby, low-latency proxy-to-replica communication to sustain high update rates.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.3\u003c\u002fb\u003e: Replica-consistency complexity cost\u003cbr\u003eFully synchronized replicas impose substantial architectural and operational complexity.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.4\u003c\u002fb\u003e: Push unavailability after quorum loss\u003cbr\u003ePushes cannot be accepted after too many healthy repository copies are lost.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.5\u003c\u002fb\u003e: Sub-three replica allocation\u003cbr\u003eReducing replicas below three for small repositories is rejected because it would weaken consistency and risk data loss.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.6\u003c\u002fb\u003e: Weaker durability and consistency guarantees\u003cbr\u003eRelaxing hard durability or consistency guarantees to improve scaling or throughput.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.7\u003c\u002fb\u003e: Quorum-based push acceptance\u003cbr\u003eAccepting pushes only while enough healthy replicas remain to form a quorum.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.8\u003c\u002fb\u003e: Durable push acknowledgement\u003cbr\u003eA push is acknowledged only after its write-ahead-log entry is fully persisted.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.9\u003c\u002fb\u003e: Single-object-storage-write-per-push\u003cbr\u003eEvery push performs one object-storage write as its limiting persistence operation.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.10\u003c\u002fb\u003e: Single-extra-copy durability strategy\u003cbr\u003eKeeping one extra copy provides single-node durability without majority coordination for conflicting writes.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.11\u003c\u002fb\u003e: All-or-nothing failed-write rollback\u003cbr\u003eReverts tentative or non-majority updates everywhere they were applied when validation or quorum agreement fails.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.12\u003c\u002fb\u003e: Write refusal during replica shortfall\u003cbr\u003eRefuses writes when the minimum safe number of replica commitments cannot be achieved.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.13\u003c\u002fb\u003e: Consistency-and-partition-tolerance priority\u003cbr\u003ePrioritizes consistency and partition tolerance over unrestricted availability in replica coordination.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write Durability\u003c\u002fi\u003e","\u003cb\u003e35.14\u003c\u002fb\u003e: Minimum two-replica write commitment\u003cbr\u003eRequires every accepted write to be committed to at least two repository replicas.\u003cbr\u003e\u003ci\u003eDimension 35: Replica Write
