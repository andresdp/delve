rite Coordination\u003c\u002fi\u003e","\u003cb\u003e26.5\u003c\u002fb\u003e: Operation-level repository provenance\u003cbr\u003eFundamental repository operations are recorded so prior states and corruption causes can be inspected.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e","\u003cb\u003e26.6\u003c\u002fb\u003e: Orchestrator-coordinated push fan-out\u003cbr\u003eDistribute pushed packs and reference transactions to repository replicas through an orchestrator.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e","\u003cb\u003e26.7\u003c\u002fb\u003e: Reference-transaction synchronization unit\u003cbr\u003eSynchronize compact Git reference transactions rather than large packfiles during consensus coordination.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e","\u003cb\u003e26.8\u003c\u002fb\u003e: Consensus-free arbitrary repository primary\u003cbr\u003eAllow any server to act as repository primary without elections or a fixed per-repository primary.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e","\u003cb\u003e26.9\u003c\u002fb\u003e: S3 compare-and-swap write synchronization\u003cbr\u003eSynchronize concurrent write-ahead-log updates with atomic S3 compare-and-swap rather than consensus.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e","\u003cb\u003e26.10\u003c\u002fb\u003e: Cloud-agnostic object-storage deployment\u003cbr\u003eDesigning durable object-storage use to deploy across cloud providers rather than depend on one provider.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e","\u003cb\u003e26.11\u003c\u002fb\u003e: Single-local-repository reference synchronization\u003cbr\u003eSynchronizing reference transactions with one local repository instead of a replica quorum.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e","\u003cb\u003e26.12\u003c\u002fb\u003e: Optimistic UDP replica gossip\u003cbr\u003eUse lossy metadata gossip for replica notifications while replicas independently verify state and recover from durable storage.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e","\u003cb\u003e26.13\u003c\u002fb\u003e: Git compaction throughput bottleneck\u003cbr\u003eAfter storage latency is reduced, Git compaction becomes the practical ingest limit.\u003cbr\u003e\u003ci\u003eDimension 26: Repository Write Coordination\u003c\u002fi\u003e"],"marker":{"color":"#DEA0FD","size":9},"mode":"markers","name":"26: Repository Write Coordination","x":{"dtype":"f8","bdata":"U0F32nlP77+43Hb7bJDfvwSXvV9KVOs\u002fSK6sFPOK4b9vVaPop0vpP79twUopcsO\u002f3mYLj97Y6T\u002fwKA0N6LviPwbx\u002fvnNcsc\u002fAAAAAAAA8L9p4m9+p93vPwwa95J0weC\u002fPhSvWz575b8="},"y":{"dtype":"f8","bdata":"CelZvb8RDL3YDm+z+Uv8vNx21KwQgAg9c5wR1iF0\u002f7wRbQ4HU60GPd5nhATYbuG8srg8hesrBz0vTLOHdMsAPQ4NnqdrBeU8+f\u002f\u002f\u002f\u002f+vDL1yTdmnNZEMPawLgQPcCv68oXQxZ\u002fxBA70="},"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e31.1\u003c\u002fb\u003e: Real-traffic failure detection\u003cbr\u003eDetecting replica or server failure through failures observed during real application requests.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.2\u003c\u002fb\u003e: Heartbeat-assisted failure detection\u003cbr\u003eUsing heartbeats as a complementary signal alongside real application traffic for failure detection and recovery.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.3\u003c\u002fb\u003e: Three-consecutive-failure offline threshold\u003cbr\u003eDemoting or marking a node offline after three consecutive failed requests.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.4\u003c\u002fb\u003e: Advisory replica demotion\u003cbr\u003eDemoting suspected failed replicas in preference order without removing them from fallback availability.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.5\u003c\u002fb\u003e: RPC failover graph failure detection\u003cbr\u003eInferring server faults from the pattern of RPC operations failing over between servers.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.6\u003c\u002fb\u003e: Application-server-specific failure views\u003cbr\u003eMaintaining failure observations separately at each application server rather than using one global view.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.7\u003c\u002fb\u003e: Cross-observer fault attribution\u003cbr\u003eComparing failure reports across application servers to distinguish file-server from application-server faults.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.8\u003c\u002fb\u003e: Heartbeat load polling and recovery confirmation\u003cbr\u003eUsing heartbeats to poll load and restore a node's online preference after failure recovery.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.9\u003c\u002fb\u003e: Heartbeat-only primary failure detection\u003cbr\u003eRelying on heartbeats as the primary mechanism for detecting failed nodes.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.10\u003c\u002fb\u003e: MxN failure-detector topology\u003cbr\u003eHave each application server independently monitor each repository server through RPCs and heartbeats.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.11\u003c\u002fb\u003e: Heartbeat detection delay\u003cbr\u003eDelayed awareness of failures when periodic heartbeats lag behind failures observed in live traffic.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.12\u003c\u002fb\u003e: Synthetic health-check functional blind spots\u003cbr\u003eNo-op health checks can miss failures in Git execution, disks, or authenticated operations.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.13\u003c\u002fb\u003e: False offline marking from consecutive request failures\u003cbr\u003eA healthy node can be temporarily marked offline after unrelated request failures happen consecutively.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.14\u003c\u002fb\u003e: Localized failure-detector errors\u003cbr\u003eKeep an observer's mistaken offline view local rather than allowing it to determine system-wide server status.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e"],"marker":{"color":"#90AD1C","size":9},"mode":"markers","name":"31: Replica Failure Detection","x":{"dtype":"f8","bdata":"FLtVrxde7jzY8KklVZ0GvRTUtAnec+W8sZ0XwYYN+zzh7v2qJIIAPeLlCVtdiwg9AQAAAACwCj2nPKKf9xIIvYXeY5plIQm9Ms2waVAK+DxTaJkCbekHvQhOOaWMYu28ZqK16Hk\u002f7bwo2eEBSr\u002f9PA=="},"y":{"dtype":"f8","bdata":"oBi2ctA00r+1gxKfxh3rP5WHUqAYuck\u002foO8qcBI44L8S6Qu4acvjv6IZ48smbu2\u002fAAAAAAAA8L8sCT6Xyd3sP66yubYMIu4\u002fOgO\u002faWnT3L9r01AE+qvsPyRhBJYBntE\u002fyjy3jPqI0T+wA3lIm9Xhvw=="},"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#AA0DFE","size":8,"symbol":"x"},"mode":"markers","name":"11: Repository Physical Storage (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#3283FE","size":8,"symbol":"x"},"mode":"markers","name":"13: Git Hosting Collaboration Model (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#85660D","si
