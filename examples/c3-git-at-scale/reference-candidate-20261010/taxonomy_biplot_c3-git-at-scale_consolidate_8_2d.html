        <script charset="utf-8" src="https://cdn.plot.ly/plotly-4.0.0.min.js" integrity="sha256-FEYfO0yRyLtZCpnW0Dw/0DHKQO7Afrq3ml4+rBB818o=" crossorigin="anonymous"></script>                <div id="4971678c-311a-4481-a3e2-379ce5c104c3" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("4971678c-311a-4481-a3e2-379ce5c104c3")) {                    Plotly.newPlot(                        "4971678c-311a-4481-a3e2-379ce5c104c3",                        [{"hoverinfo":"skip","line":{"color":"#FEAF16","width":3},"mode":"lines","showlegend":false,"x":[-1.0,1.0],"y":[2.345346139520642e-15,-2.345346139520642e-15],"type":"scatter"},{"hoverinfo":"skip","line":{"color":"#90AD1C","width":3},"mode":"lines","showlegend":false,"x":[-2.2204460492503123e-15,2.2204460492503123e-15],"y":[-1.0,1.0],"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e29.1\u003c\u002fb\u003e: Unsafe-replication write refusal\u003cbr\u003eRefuse writes that cannot be committed to the required replicas safely.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.2\u003c\u002fb\u003e: Unconditional write acceptance\u003cbr\u003eAccept writes regardless of whether the required replication guarantee can be maintained.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.3\u003c\u002fb\u003e: Three-phase replica commit\u003cbr\u003eCoordinate updates to distant replicas with a three-phase commit protocol.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.4\u003c\u002fb\u003e: WAL durability before push acknowledgment\u003cbr\u003eAcknowledge a push only after the complete operation is durably persisted in the write-ahead log.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.5\u003c\u002fb\u003e: Three-replica voting configuration\u003cbr\u003eEach repository uses three replicas to provide redundancy and continued pushes when one machine fails.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.6\u003c\u002fb\u003e: Two-copy synchronous commitment\u003cbr\u003eRequire synchronous commitment to two replicas before accepting a write.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.7\u003c\u002fb\u003e: Minimum replica-count write threshold\u003cbr\u003eUse the ability to create the required minimum number of copies as the write-acceptance condition.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.8\u003c\u002fb\u003e: Two-copy durability strategy\u003cbr\u003eUse one additional copy as the durability strategy rather than a larger quorum or conflict-serialization scheme.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.9\u003c\u002fb\u003e: Durability-induced write unavailability\u003cbr\u003eTemporarily lose write availability when the replication guarantee cannot be maintained.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.10\u003c\u002fb\u003e: Consensus tail-latency amplification\u003cbr\u003eAdding coordinated replicas increases transaction latency because each phase waits for the slowest server.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.11\u003c\u002fb\u003e: Replica-count push-throughput degradation\u003cbr\u003eIncreasing coordinated replica count reduces push throughput because every server participates in commit.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e","\u003cb\u003e29.12\u003c\u002fb\u003e: Idle-replica resource overhead\u003cbr\u003eMaintaining multiple replicas for many small repositories consumes resources even when replicas are mostly idle.\u003cbr\u003e\u003ci\u003eDimension 29: Write Commitment and Durability\u003c\u002fi\u003e"],"marker":{"color":"#FEAF16","size":9},"mode":"markers","name":"29: Write Commitment and Durability","x":{"dtype":"f8","bdata":"aXMmHXwX4z8AAAAAAADwP9JdvqpSHuO\u002fvHlGfL4k6T+ZJiaYeCzsvxh1lCmQ1NE\u002faplF\u002ftd53j+zePs+ODHGv8r\u002fpG\u002fcpec\u002fRZmbEbkn6b9OtSi5q2Xiv9tCl\u002f\u002fMpOu\u002f"},"y":{"dtype":"f8","bdata":"XcR83gE12bz9\u002f\u002f\u002f\u002f\u002fx\u002flvNxXbyUJPtk8W4YKwEGZ4Lx4L3GcW5niPJYC5lamise8RPLblm8e1LxYBShD\u002fEy9PLTZZwv9ON+8LLifLDmb4Dxev3e6PErYPCDbulTLP+I8"},"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003e31.1\u003c\u002fb\u003e: Live-operation failure detection\u003cbr\u003eDetect replica failure from repeated failed Git or RPC operations and route requests away without waiting for a separate detector.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.2\u003c\u002fb\u003e: Combined heartbeat and traffic detection\u003cbr\u003eCombine heartbeat liveness checks with real application traffic to detect failures and confirm recovery.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.3\u003c\u002fb\u003e: Heartbeat-only failure detection\u003cbr\u003eUse heartbeats alone as the primary health signal for repository replicas.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.4\u003c\u002fb\u003e: Application-server-local failure views\u003cbr\u003eMaintain replica failure state independently at each application server rather than relying on one global view.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.5\u003c\u002fb\u003e: Consecutive-failure offline threshold\u003cbr\u003eMark a replica offline only after a configured sequence of failed requests, reducing reactions to isolated errors.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.6\u003c\u002fb\u003e: Preference-ordered replica failover\u003cbr\u003eTry replicas in a preference order and demote repeatedly failing nodes without permanently excluding them.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.7\u003c\u002fb\u003e: No-op-only health checks\u003cbr\u003eUse no-op checks alone to determine whether a repository replica is healthy for authenticated Git operations.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.8\u003c\u002fb\u003e: Cross-server failure correlation\u003cbr\u003eCorrelate independent application-server failure reports to distinguish a bad file server from a faulty reporting application server.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.9\u003c\u002fb\u003e: Heartbeat-based node recovery signal\u003cbr\u003eHeartbeats can signal that a previously unavailable repository node has recovered.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.10\u003c\u002fb\u003e: Advisory replica demotion\u003cbr\u003eA replica may be demoted from preferred service without being treated as permanently failed.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.11\u003c\u002fb\u003e: RPC failover health telemetry\u003cbr\u003eFailover behavior supplies server-health telemetry used in replica failure assessment.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e","\u003cb\u003e31.12\u003c\u002fb\u003e: False-positive replica eviction\u003cbr\u003eTemporarily remove or demote a healthy replica because random operation failures trigger the failure threshold.\u003cbr\u003e\u003ci\u003eDimension 31: Replica Failure Detection\u003c\u002fi\u003e"],"marker":{"color":"#90AD1C","size":9},"mode":"markers","name":"31: Replica Failure Detection","x":{"dtype":"f8","bdata":"Vr2x0WnSu7zaB8nwnuvhvDHOZzs2c+C8efK2gNGt0zwtDpiOOo7UPOKZVOx8BeA8GLkQLTqw0ryNdDHGTTO8PP7\u002f\u002f\u002f\u002f\u002f\u002f+O83k11c0Hh4TxAiZE1rxK5PPFEC+x2B9k8"},"y":{"dtype":"f8","bdata":"4f1aQe5Bxr8tpkGBMazsvx59DF\u002fwUeq\u002fkh2LZ4J83z+MPhNyyHHgPzn2IHphouk\u002f9vRNe8Pm3b+mw1prcY\u002fGPwAAAAAAAPC\u002fAOPu65ub7D+cOkGR8g7EP8PQ1bz4BeQ\u002f"},"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#AA0DFE","size":8,"symbol":"x"},"mode":"markers","name":"10: Replica Read Routing (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#3283FE","size":8,"symbol":"x"},"mode":"markers","name":"12: Write Continuity During Maintenance (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#85660D","size":8,"symbol":"x"},"mode":"markers","name":"14: Maintenance Scheduling Policy (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#782AB6","size":8,"symbol":"x"},"mode":"markers","name":"15: Repository Hosting Model (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#565656","size":8,"symbol":"x"},"mode":"markers","name":"16: Client Remote Synchronization (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#1C8356","size":8,"symbol":"x"},"mode":"markers","name":"17: Compaction Coordination (not shown — ~0 loading here)","showlegend":true,"x":[null],"y":[null],"type":"scatter"},{"hoverinfo":"skip","marker":{"color":"#16FF32","size":8,"symbo
