# Delve Configuration — Case C3 sample: a small published snapshot (at most 5 dimensions)
# ──────────────────────────────────────────────
# Same corpus, models and settings as c3_git_at_scale_config.yaml, except that the number
# of dimensions is capped at 5 (taxonomy.max_num_clusters; the cap is given to the LLM in
# the generation, update and review prompts) and the outputs go to their own folder. The
# sample illustrates the output of the approach; the study run is the uncapped one.
#
# Build the corpus (once): python benchmark/fetch_sources.py benchmark/c3-git-at-scale
#                          python benchmark/build_corpus.py c3-git-at-scale
# Run:  python main.py --corpus examples/c3-git-at-scale/c3-git-at-scale_corpus.json \
#                      --config examples/c3-git-at-scale/c3_git_at_scale_sample_config.yaml \
#                      --output examples/c3-git-at-scale/sample/

models:
  # Three LLM roles; use a different model for each (the same model for several roles
  # runs, with a warning: the judging is then not independent of the generation).
  # Generation LLM: builds the design space (open coding, summaries, taxonomy
  # generation/update/review, consolidation, merging, selection, labeling, report text).
  generation_llm: "openai/gpt-5.6-luna"
  # Evaluation LLM: judges it inside the pipeline (evaluation scoreboard, consistency
  # adjudication, saturation critic).
  evaluation_llm: "openai/gpt-5.6-luna"
  # Matching LLM: judges value-option pairs in ground-truth matching (--match-gt; OpenAI).
  matching_llm: "openai/gpt-5.6-luna"

  embedding: "openai/text-embedding-3-small"

pipeline:
  max_runs: 0
  sample_size: 0
  # C3: 48 passages; 8 gives 6 minibatches, so saturation can stop the loop early
  # (C1's 20 would give 2-3 here and only one for the 16 curated documents).
  batch_size: 8
  random_seed: 42
  mode: "train"
  taxonomy_input: null

taxonomy:
  name: "c3-git-at-scale-sample"
  # Sample: at most 5 dimensions (the study run is uncapped).
  max_num_clusters: 5
  cluster_name_length: 10
  cluster_description_length: 30
  suggestion_length: 30
  explanation_length: 20
  # Passages are short, so require three saturated minibatches in a row before
  # stopping early (two can stop before most sources have been read).
  saturation_streak_threshold: 3
  value_merge_distance_threshold: 0.35
  value_merge_borderline_band: 0.40
  consolidate_values: true
  # A candidate decision can be adopted by one source and rejected by another:
  # merge such values into one, keeping both stances as evidence (status "mixed").
  # False = values only merge within their exact status.
  merge_value_stances: true

  # Evidence linking after consolidation: assign every open code to its most similar
  # value (same decision status) and record the supporting documents on that value.
  link_evidence: true
  # Minimum cosine similarity for a code to count as evidence (text-embedding-3-small;
  # calibrated on C1: the best code-option similarity has median 0.57, so 0.35 accepted
  # 99% of codes and 0.5 accepts ~70%).
  evidence_min_similarity: 0.5
  # Remove values no document supports after evidence linking (kept inspectable on
  # their dimension as unsupported_values).
  drop_unsupported_values: true

  # ── Fragmentation controls ─────────────────────────────────────────
  # Keep the taxonomy from splitting one design decision into many overlapping
  # dimensions.

  # Merge near-duplicate dimensions (the same design decision under different
  # names) before value consolidation. Pairs below the distance threshold merge
  # automatically; pairs within the band above it go to an LLM judge, which merges
  # only when both dimensions' options answer one choice (detecting vs. mitigating
  # a problem stay separate). Distances are Euclidean on L2-normalized embeddings of
  # "name. description Options: ..."; with text-embedding-3-small, near-duplicates
  # sit around 0.55-0.90 and unrelated dimensions around 1.0. Set false to disable.
  merge_dimensions: true
  dimension_merge_distance_threshold: 0.45
  dimension_merge_borderline_band: 0.45

  # Minimum support: at dimension selection, drop (with a recorded rationale)
  # dimensions whose evidence comes from fewer than this many sources. A source is
  # the document a passage comes from (passage ids "sNN_pKK"), or the document
  # itself for other corpora. Needs link_evidence. 0 disables the rule.
  # C3: 1 for C3-raw. Three systems (GitHub's filesystem distribution, Google's
  # JGit/DHT, Azure DevOps) appear only in source s1, and each source is one
  # organization's write-up rather than an independent report, so recurrence across
  # sources is the wrong grounding test here. Decided before any C3 run (2026-10-08).
  min_dimension_sources: 1

  # Decision points need alternatives: drop (with a recorded rationale) dimensions with
  # fewer than this many candidate decisions (accepted/rejected values; outcomes, i.e. effects
  # of decisions, do not count). 0 disables the rule.
  min_candidate_decisions: 2
  # Selective coding: true = an LLM drops dimensions it judges irrelevant to the use case (after the
  # support and decision-point rules); false = keep every dimension that passes those rules.
  relevance_selection: false

  # Tolerant saturation: a minibatch also counts as saturated when at least this
  # share of its open codes is already covered by the taxonomy. 1.0 = strict
  # (every relevant code covered), which with detailed documents almost never
  # triggers, so the update loop keeps adding dimensions until the data runs out.
  saturation_min_coverage: 0.9
  # Minimum share of the corpus's documents open-coded before saturation may end the
  # update loop. Batches are random, so a few early batches can agree by chance;
  # saturation reached earlier is recorded but must still hold once this share is
  # reached. 0 = saturation alone decides.
  saturation_min_corpus_fraction: 0.7

  # How update_taxonomy and review_taxonomy change the taxonomy:
  #   rewrite          re-emit the whole taxonomy each time (default);
  #   rewrite_restore  rewrite, then put back evidence-backed values the rewrite dropped (ablation control);
  #   tools            edit it through validated coding operations, logged as an operation log.
  edit_mode: "tools"
  # Tools mode: maximum model turns per update or review.
  edit_max_steps: 12
  # C3: problem and genre only; no organizations, systems or example dimensions, so
  # whether the systems come out as distinct points is mined, not prompted.
  use_case: >-
    Identify the architectural design decisions involved in making Git repositories
    work at scale, for very many repositories, very large repositories and very many
    users, on the hosting servers and on the clients, as documented in an engineering
    article and official engineering background material by the teams that built such
    systems. For each
    decision, identify the alternative options the teams adopted or considered and
    rejected, the forces (quality attributes, constraints and practical concerns) that
    drive the choice between them, and how decisions relate to one another. Each
    dimension must name one architectural design decision; its values are the
    alternative options for that decision.

summarization:
  # Passages are already short and open coding reads the full text (below), so
  # summaries are not needed; labeling reads the full text anyway.
  skip: true
  summary_length: 20
  explanation_length: 30
  max_concurrency: 5

open_coding:
  # What the open coder reads per document: "summary" (the summary when one
  # exists, else the content) or "content" (always the full document text, so
  # codes stay grounded in the source even when summarization is on). Here:
  # always the full passage text, never a summary (paper plan, item P2).
  input: "content"

labeling:
  fallback_category: "Other"
  review_sample_size: 15

output:
  max_displayed_documents: 20
  max_docs_per_category_tree: 5
  content_preview_length: 120
  default_output_dir: "examples/c3-git-at-scale/sample"  # C3 sample
  graph_filename: "graph.png"

visualization:
  enabled: true
  every_iteration: false
  dimensions: 2
  output_dir: null

evaluation:
  enabled: true
  threshold: 0.5
  consistency_threshold: 0.25
  consistency_borderline_band: 0.08
  max_documents: 20
  # Save every scoreboard of the run (taxonomy JSON "evaluation_history": one per
  # iteration, then the final view) and show the scores across iterations. The
  # loop's feedback uses the scores either way.
  save_history: true
  # Criteria scored and reported but not fed back to the update/review passes.
  # Completeness is judged against the use case alone (the judge sees no data), so
  # in the loop it pushes for use-case topics the corpus may not support; gaps in
  # the data are fed back by the saturation critic and the coverage criteria.
  feedback_exclude: ["Completeness"]
  # Score the loop's drafts every N iterations (as C1; about 6 drafts here; 1 = every draft). The draft
  # of the last minibatch and the final view are always scored; feedback reaches only
  # the update that follows a scored draft.
  every_n_iterations: 3
