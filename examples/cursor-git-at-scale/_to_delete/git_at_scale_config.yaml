# Delve Configuration — Cursor "Git at Any Scale" corpus
# ──────────────────────────────────────────────
# Use with: python main.py --corpus examples/cursor-git-at-scale/cursor_git_at_scale_architecture_decisions.json --config examples/cursor-git-at-scale/config.yaml --output examples/cursor-git-at-scale/
#
# cursor_git_at_scale_architecture_decisions.json is produced by build_corpus.py
# in this same folder, from the 16 markdown documents under 01-context/ ..
# 06-evolution/. This file only orients the pipeline toward the domain
# (use_case, below) — it defines no dimensions or values; those are what
# running Delve on this corpus is meant to discover.

models:
  model: "openai/gpt-5.4-nano"
  fast_llm: "openai/gpt-5.4-nano"

  # Embedding model — used for value consolidation and taxonomy biplot
  # axis positions. Supported providers: openai/<model>, ollama/<model>.
  embedding: "openai/text-embedding-3-small"

pipeline:
  max_runs: 0
  sample_size: 0
  batch_size: 8
  random_seed: 42

taxonomy:
  name: "cursor-git-at-scale"
  max_num_clusters: null  # Let the LLM determine the number of dimensions from the data
  cluster_name_length: 10
  cluster_description_length: 30
  suggestion_length: 30
  explanation_length: 20

  # Consecutive saturated minibatches required to stop the update loop early.
  saturation_streak_threshold: 2

  # Embedding-distance cutoff (epsilon, Euclidean on L2-normalized vectors)
  # below which two values within the same dimension are merged automatically.
  # Calibrated for openai/text-embedding-3-small; tune when changing models.
  value_merge_distance_threshold: 0.2

  # Distance band above the cutoff routed to LLM adjudication instead of
  # auto-merge or auto-reject.
  value_merge_borderline_band: 0.08

  # Value consolidation: merge semantically duplicate values within each
  # dimension (embedding distance + LLM adjudication). When false, values
  # pass through unchanged and visualization uses unitary axis positions.
  consolidate_values: true

  use_case: >-
    Classify architectural decisions, tradeoffs, alternative solutions, and
    lessons learned in how Git repository hosting has been scaled over time —
    from GitHub's early filesystem-distribution experiments and Google's
    distributed-object-store attempt, through GitHub's consensus-replicated
    Spokes system and Microsoft's client-side virtualization (GVFS/Scalar), to
    Cursor's write-ahead-log-based Continuity/Origin system. Identify the
    orthogonal dimensions of architectural variation along which these
    decisions differ (e.g., where the source of truth for a repository lives,
    how consistency is achieved across replicas, how replica count relates to
    cost and correctness, how compaction/maintenance work is distributed,
    what a design assumes about client vs. server responsibility). Each
    decision belongs to the dimension whose axis of variation best describes
    its fundamental architectural intent.

summarization:
  skip: false
  summary_length: 20
  explanation_length: 30
  max_concurrency: 5

labeling:
  fallback_category: "Other"
  review_sample_size: 15

output:
  max_displayed_documents: 26
  max_docs_per_category_tree: 5
  content_preview_length: 120
  default_output_dir: "output"
  graph_filename: "graph.png"

# Taxonomy biplot visualization (erdogant/pca based — values on dimension axes).
visualization:
  # Master on/off switch (default false — no cost/latency on normal runs).
  enabled: true

  # If false, only render the final (post-consolidation) chart; if true,
  # render at every stage (generate/update/review/consolidate).
  every_iteration: true

  # PCA projection dimensions: 2 or 3.
  dimensions: 2

  # Where chart files are written (null = default_output_dir / --output).
  output_dir: null
