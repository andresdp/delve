# Delve Configuration — CityBike Architecture Decisions
# ──────────────────────────────────────────────
# Use with: python main.py --corpus examples/campus-bike/campus_bike_architecture_decisions.json --config examples/campus-bike/campus_bike_config.yaml --output examples/campus-bike/

models:
  model: "openai/gpt-5.6-luna"
  fast_llm: "openai/gpt-5.4-mini"

  # Embedding model — used for value consolidation and taxonomy biplot
  # axis positions. Supported providers: openai/<model>, ollama/<model>.
  embedding: "openai/text-embedding-3-small"

pipeline:
  max_runs: 0
  sample_size: 0
  batch_size: 8
  random_seed: 42

taxonomy:
  name: "campus-bike"
  max_num_clusters: 7  # if null, Let the LLM determine the number of dimensions from the data
  cluster_name_length: 10
  cluster_description_length: 30
  suggestion_length: 30
  explanation_length: 20

  # Consecutive saturated minibatches required to stop the update loop early.
  saturation_streak_threshold: 2

  # Embedding-distance cutoff (epsilon, Euclidean on L2-normalized vectors)
  # below which two values within the same dimension are merged automatically.
  # Calibrated for openai/text-embedding-3-small; tune when changing models.
  value_merge_distance_threshold: 0.2

  # Distance band above the cutoff routed to LLM adjudication instead of
  # auto-merge or auto-reject.
  value_merge_borderline_band: 0.08

  # Value consolidation: merge semantically duplicate values within each
  # dimension (embedding distance + LLM adjudication). When false, values
  # pass through unchanged and visualization uses unitary axis positions.
  consolidate_values: true

  use_case: >-
    Classify software architecture design decisions for CityBike, a
    bike-sharing platform for urban mobility and eco-friendly
    transportation. The application is available on both web and mobile
    devices, allowing riders to locate, unlock (via QR code), and pay for
    bike rentals within a 1000-meter radius. The system must comply with
    GDPR, the Privacy Directive, ISO 27001, and local EU/China standards.
    It integrates with third-party payment platforms, tracks bike
    locations in real time, and must ensure the security and privacy of
    user and payment data. The architecture may leverage container
    orchestration, service registry and discovery, API gateway, message
    broker, and distributed tracing. Identify the orthogonal dimensions of
    architectural variation along which these decisions differ — each
    dimension should capture a fundamentally different type of
    architectural concern (e.g., service decomposition strategy, API
    gateway and request routing, bike location tracking approach,
    third-party payment integration, regulatory compliance mechanism,
    real-time communication pattern, service discovery strategy,
    observability and tracing approach). Each decision belongs to the
    dimension whose axis of variation best describes its fundamental
    architectural intent.

summarization:
  skip: false
  summary_length: 20
  explanation_length: 30
  max_concurrency: 5

labeling:
  fallback_category: "Other"
  review_sample_size: 15

output:
  max_displayed_documents: 26
  max_docs_per_category_tree: 5
  content_preview_length: 120
  default_output_dir: "output"
  graph_filename: "graph.png"

# Taxonomy biplot visualization (erdogant/pca based — values on dimension axes).
visualization:
  # Master on/off switch (default false — no cost/latency on normal runs).
  enabled: true

  # If false, only render the final (post-consolidation) chart; if true,
  # render at every stage (generate/update/review/consolidate).
  every_iteration: true

  # PCA projection dimensions: 2 or 3.
  dimensions: 2

  # Where chart files are written (null = default_output_dir / --output).
  output_dir: null