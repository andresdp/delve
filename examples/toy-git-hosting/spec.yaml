# Toy design space: Git hosting at scale (a curated slice of the C3 case, for teaching).
#
# Five dimensions, each with three or four mutually exclusive values. Every value takes its evidence from the
# C3 mined run (output/evaluation/c3-git-at-scale/full_s42): `from` lists the mined values whose passages and
# stances it inherits, so each passage id below is one the pipeline linked to that idea. The dimensions, values,
# descriptions and relations are curated by hand; the evidence is not. `status` overrides the inherited one where
# the curated value is narrower than its mined source.
#
# Systems (from benchmark/c3-git-at-scale/systems.csv) as points of this space:
#   GitHub Spokes          1.1 2.2 3.1 4.1 5.1
#   Cursor Continuity      1.2 2.3 3.2 4.1 5.3
#   GitHub before Spokes   1.1 2.4 3.3 4.1
#   Microsoft VFS for Git  4.3 5.2
#   Microsoft Scalar       4.2 5.2
#   Google JGit on a DHT   1.3
#   Azure DevOps store     1.4 (rejected by the Cursor source as a second source of truth)

name: toy-git-hosting
title: Git hosting at scale (toy)
mined_run: output/evaluation/c3-git-at-scale/full_s42
sources: benchmark/c3-git-at-scale/sources.csv

dimensions:
  - id: "1"
    name: Source of truth for repository state
    description: Where the authoritative copy of each repository's objects and references lives.
    values:
      - id: "1.1"
        label: Repository files on server disks
        description: Plain Git repositories on the servers' local disks are the authoritative state.
        from: ["15.1", "15.5"]
      - id: "1.2"
        label: Write-ahead log in object storage
        description: An append-only log in object storage is the authority; repositories on disk are derived from it.
        from: ["24.1"]
      - id: "1.3"
        label: Objects in a distributed hash table
        description: Git objects are stored individually in a distributed key-value store.
        from: ["16.3"]
      - id: "1.4"
        label: Blobs plus a relational reference database
        description: Pack data in blob storage and references in a relational database, two stores to keep consistent.
        from: ["24.2"]

  - id: "2"
    name: Replication for durability
    description: How copies of a repository are kept so that a lost machine loses no data.
    values:
      - id: "2.1"
        label: Block-level filesystem replication
        description: The filesystem under Git is replicated block by block between paired machines.
        from: ["15.6"]
      - id: "2.2"
        label: Three Git replicas with majority writes
        description: Each repository has three plain Git replicas; a write succeeds once a majority has it.
        from: ["31.1", "31.2"]
      - id: "2.3"
        label: Durability delegated to object storage
        description: The object store holding the log keeps the data durable; servers hold no unique data.
        from: ["31.7", "31.8"]
      - id: "2.4"
        label: Single copy on a file server
        description: One file server holds each repository, reached by RPC, with no replica.
        from: ["29.5", "15.8"]

  - id: "3"
    name: Reference update coordination
    description: How concurrent updates to a repository's references are ordered and made atomic.
    values:
      - id: "3.1"
        label: Three-phase commit across replicas
        description: Reference updates run as a transaction that all replicas vote on.
        from: ["14.2"]
      - id: "3.2"
        label: Compare-and-swap on the log
        description: Writers append to the log with a compare-and-swap, without a consensus protocol.
        from: ["14.1"]
      - id: "3.3"
        label: One server serializes the updates
        description: The single file server holding the repository applies updates one at a time.
        from: ["29.5"]

  - id: "4"
    name: Client data transfer
    description: What a developer's machine downloads to work on a repository.
    values:
      - id: "4.1"
        label: Full clone over the Git protocol
        description: The client fetches the whole history with standard Git.
        from: ["10.2"]
      - id: "4.2"
        label: Partial clone with sparse checkout
        description: The client fetches only the history and files it needs, with standard Git features.
        from: ["10.9", "11.1"]
      - id: "4.3"
        label: Virtualized filesystem with on-demand objects
        description: A virtual filesystem shows every file and downloads objects only when a file is opened.
        from: ["12.1", "10.3", "10.6"]

  - id: "5"
    name: Serving reads
    description: Where read traffic (fetches, clones, CI checkouts) is served from.
    values:
      - id: "5.1"
        label: Nearest up-to-date replica
        description: Reads go to the closest replica that has the latest state.
        from: ["27.1", "27.2"]
      - id: "5.2"
        label: Cache servers near the clients
        description: Cache servers in each office or region serve objects and forward misses to the origin.
        from: ["10.7"]
      - id: "5.3"
        label: Stateless servers with a local disk cache
        description: Any server can serve any repository, rebuilding a warm copy on its local disk from the log.
        from: ["29.4", "16.2"]

relations:
  - {source: "2", target: "1", type: requires, reading: "Choices on Replication for durability require a decision on Source of truth for repository state", rationale: "What must be replicated, and where, follows from where the authoritative state lives."}
  - {source: "3", target: "1", type: requires, reading: "Choices on Reference update coordination require a decision on Source of truth for repository state", rationale: "Updates are ordered by whatever holds the authoritative references."}
  - {source: "2", target: "5", type: constrains, reading: "Choices on Replication for durability limit the options on Serving reads", rationale: "Serving from the nearest replica needs replicas; a single copy leaves one place to read from."}
  - {source: "4", target: "5", type: constrains, reading: "Choices on Client data transfer limit the options on Serving reads", rationale: "On-demand object downloads put every file open on the network, which cache servers near the clients absorb."}
