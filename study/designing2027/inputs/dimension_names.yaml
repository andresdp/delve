# Dimension names for the expert ML-workflow space (Warnett and Zdun's decision model, gt_model.json).
#
# The model phrases every decision as a question and uses that question as the decision's name. A dimension is
# named as a concern instead, so each decision gets a short name here; its question is kept, word for word, as the
# dimension's description. The names are ours; the decisions, their questions and their options are the authors'.
# build_workspace.py applies these names when it imports the model; gt_model.json itself is not changed.
#
# decision id (in gt_model.json): dimension name
