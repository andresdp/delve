# Token prices (USD per million tokens) for the session models, used for the cost metric.
# List prices on the date below, standard tier (not batch), from OpenAI's model page:
# https://developers.openai.com/api/docs/models/gpt-6-luna
# A model missing here gets cost null. Keys are the model names passed to run_sessions.py --model.
date: "2026-10-26"
models:
  gpt-6-luna:
    input: 0.10
    cached_input: 0.01
    output: 0.50
