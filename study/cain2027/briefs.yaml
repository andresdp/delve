# Design briefs for the C1 study, final: the 24 sessions ran on these briefs (2026-10-26).
# `forces` are force ids from inputs/gt_model.json (the scorer rejects unknown ids); they are the brief's
# priorities, used for requirements fit and never shown to the agent.
draft: false
briefs:
  - id: fraud
    system: Card-fraud scoring service
    forces: [low_latency, near_real_time_support, reliability, reproducibility]
    text: |
      A payments company scores every card transaction for fraud before it is authorized. Scores must come back
      within tens of milliseconds, the service must keep working during peaks, and every score must be
      explainable later to auditors: which model version and which features produced it.
  - id: vision
    system: On-device visual inspection
    forces: [offline_support, process_and_work_automation, simplified_deployment, reduce_cost]
    text: |
      A manufacturer runs a defect-detection model on cameras along its production lines, often without network
      access. The model is retrained every week from newly labelled images and pushed to the devices. The team
      is small and the infrastructure budget is tight.
  - id: forecast
    system: Retail demand forecasting
    forces: [reproducibility, maintainability, development_velocity, process_and_work_automation]
    text: |
      A retailer forecasts weekly demand per store and product. A team of three data scientists owns the
      pipeline end to end. Forecasts must be reproducible for any past week, and new model ideas should reach
      production quickly without breaking the weekly run.
  - id: documents
    system: Large-scale document classification
    forces: [data_throughput, scalability, observability, loose_coupling]
    text: |
      An insurer classifies millions of incoming documents per day into claim types with an LLM-based
      classifier. Volume varies strongly over the year, several teams consume the results, and operators need
      to see when classification quality drifts.
