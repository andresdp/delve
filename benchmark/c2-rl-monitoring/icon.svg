<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="C2 RL monitoring">
  <title>C2: Monitoring deployed RL systems</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D3461"/><stop offset="1" stop-color="#0D1830"/></linearGradient></defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <!-- agent-environment loop -->
  <path d="M40,110 a34,34 0 0 1 64,-16" fill="none" stroke="#2EC4B6" stroke-width="6" stroke-linecap="round"/>
  <path d="M108,126 a34,34 0 0 1 -64,16" fill="none" stroke="#FFB703" stroke-width="6" stroke-linecap="round"/>
  <path d="M96,80 l10,14 l-16,4" fill="none" stroke="#2EC4B6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52,156 l-10,-14 l16,-4" fill="none" stroke="#FFB703" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="74" cy="118" r="12" fill="#FFFFFF" stroke="#13254A" stroke-width="2.5"/>
  <!-- monitoring chart -->
  <rect x="132" y="64" width="98" height="98" rx="12" fill="#EEF3FB" fill-opacity="0.08" stroke="#B7C6DE" stroke-width="2"/>
  <g stroke="#A9B8D2" stroke-width="2" stroke-dasharray="4 4"><line x1="142" y1="96" x2="220" y2="96"/></g>
  <polyline points="142,140 158,132 172,136 186,126 198,130 208,84 220,92" fill="none" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="208" cy="84" r="7" fill="#FF6B6B" stroke="#13254A" stroke-width="2.5"/>
  <text x="128" y="206" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#EEF3FB">C2</text>
  <text x="128" y="232" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#A9B8D2">RL monitoring</text>
</svg>
