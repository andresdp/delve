@startuml
skinparam monochrome true
skinparam ClassBackgroundColor White
hide empty members
hide circle
skinparam defaultFontName Arial
skinparam defaultFontSize 11
left to right direction
class "<b>Safe Exploration Strategy Selection</b>\n<b>: Decision</b>" as __1_Safe_Exploration_Strategy_Selection
class "<b>Production Monitoring Signal Selection</b>\n<b>: Decision</b>" as __2_Production_Monitoring_Signal_Selection
class "<b>Automated Response Mechanism Selection</b>\n<b>: Decision</b>" as __3_Automated_Response_Mechanism_Selection
class "<b>Reward Degradation Test Statistic</b>\n<b>Selection : Decision</b>" as __4_Reward_Degradation_Test_Statistic_Selection
class "<b>False Alarm Rate Control Method</b>\n<b>: Decision</b>" as __5_False_Alarm_Rate_Control_Method
class "<b>Reward Hacking Detection Strategy</b>\n<b>: Decision</b>" as __6_Reward_Hacking_Detection_Strategy
class "<b>Reward Hacking Mitigation Architecture</b>\n<b>: Decision</b>" as __7_Reward_Hacking_Mitigation_Architecture
__2_Production_Monitoring_Signal_Selection - -> __3_Automated_Response_Mechanism_Selection: <<Feeds Into Via Trigger>>\n<<Mandatory Next>>\n<<Enables>>\noffer an abstraction layer for\ndata access, monitoring enables\nautomated response
__2_Production_Monitoring_Signal_Selection - -> __4_Reward_Degradation_Test_Statistic_Selection: <<Constrains>>\nsignal repertoire determines available\nstatistical tests
__4_Reward_Degradation_Test_Statistic_Selection - -> __5_False_Alarm_Rate_Control_Method: <<Constrains>>\nselected test determines applicable\ncalibration methods
__4_Reward_Degradation_Test_Statistic_Selection - -> __6_Reward_Hacking_Detection_Strategy: <<Complements But Limited By>>\n<<Can Be Combined With>>\ndownward drift detection needs\ngaming coverage, combine for full\ncoverage
__6_Reward_Hacking_Detection_Strategy - -> __4_Reward_Degradation_Test_Statistic_Selection: <<Complements>>
__6_Reward_Hacking_Detection_Strategy - -> __7_Reward_Hacking_Mitigation_Architecture: <<Tense Interaction Requires Separation>>\nRLHF hiding degrades CoT
@enduml

