@startuml
skinparam monochrome true
skinparam ClassBackgroundColor White
hide empty members
hide circle
skinparam defaultFontName Arial
skinparam defaultFontSize 11
left to right direction
class "<b>False Alarm Rate Control Method</b>\n<b>: Decision</b>" as __1_False_Alarm_Rate_Control_Method
class "<b>Bootstrap FAR (BFAR) : Practice</b>" as __2_Bootstrap_FAR__BFAR_
class "<b>Fixed Statistical Threshold : Practice</b>" as __3_Fixed_Statistical_Threshold
class "<b>Adaptive Threshold : Practice</b>" as __4_Adaptive_Threshold
class "<b>Variance-Tuned Threshold : Practice</b>" as __5_Variance_Tuned_Threshold
class "<b>Reward Degradation Test Statistic</b>\n<b>Selection : Decision</b>" as __6_Reward_Degradation_Test_Statistic_Selection
__1_False_Alarm_Rate_Control_Method - -> __2_Bootstrap_FAR__BFAR_: <<Option>>\n{description = "Bootstrap methods\nto control false-alarm probability"}
__1_False_Alarm_Rate_Control_Method - -> __3_Fixed_Statistical_Threshold: <<Option>>\n{description = "Static thresholds\nbased on assumed distributions"}
__1_False_Alarm_Rate_Control_Method - -> __4_Adaptive_Threshold: <<Option>>\n{description = "Adjust thresholds\nonline based on observed statistics"}
__1_False_Alarm_Rate_Control_Method - -> __5_Variance_Tuned_Threshold: <<Option>>\n{description = "Calibrate thresholds\nto historical variance"}
__6_Reward_Degradation_Test_Statistic_Selection - -> __1_False_Alarm_Rate_Control_Method: <<Constrains>>\nselected test determines applicable\ncalibration methods
@enduml

