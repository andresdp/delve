<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="C1 ML workflow">
  <title>C1: ML workflow</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D3461"/><stop offset="1" stop-color="#0D1830"/></linearGradient></defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <!-- data store -->
  <g fill="#2EC4B6" stroke="#13254A" stroke-width="2.5">
    <path d="M30,88 v44 a22,8 0 0 0 44,0 v-44"/><ellipse cx="52" cy="88" rx="22" ry="8"/>
  </g>
  <path d="M30,103 a22,8 0 0 0 44,0 M30,118 a22,8 0 0 0 44,0" fill="none" stroke="#13254A" stroke-width="2.5"/>
  <!-- model: small network -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2">
    <line x1="108" y1="86" x2="138" y2="100"/><line x1="108" y1="86" x2="138" y2="126"/><line x1="108" y1="140" x2="138" y2="100"/>
    <line x1="108" y1="140" x2="138" y2="126"/><line x1="108" y1="113" x2="138" y2="100"/><line x1="108" y1="113" x2="138" y2="126"/>
    <line x1="138" y1="100" x2="166" y2="113"/><line x1="138" y1="126" x2="166" y2="113"/>
  </g>
  <g fill="#FFB703" stroke="#13254A" stroke-width="2.5">
    <circle cx="108" cy="86" r="8"/><circle cx="108" cy="113" r="8"/><circle cx="108" cy="140" r="8"/>
    <circle cx="138" cy="100" r="8"/><circle cx="138" cy="126" r="8"/><circle cx="166" cy="113" r="9"/>
  </g>
  <!-- deployment: box with arrow -->
  <rect x="190" y="92" width="40" height="42" rx="8" fill="#FF6B6B" stroke="#13254A" stroke-width="2.5"/>
  <path d="M210,124 v-20 m-9,9 l9,-9 l9,9" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- flow arrows -->
  <g stroke="#B7C6DE" stroke-width="3" stroke-dasharray="5 5" fill="none"><line x1="78" y1="113" x2="96" y2="113"/><line x1="176" y1="113" x2="186" y2="113"/></g>
  <text x="128" y="206" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#EEF3FB">C1</text>
  <text x="128" y="232" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#A9B8D2">ML workflow</text>
</svg>
