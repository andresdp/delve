# DelveDSpace Configuration
# ─────────────────────
# All tunable settings for the taxonomy generation pipeline.
# Override via CLI flags: --model, --fast-model, --config <path>

models:
  # Main reasoning model — used for taxonomy generation and review.
  model: "openai/gpt-5.6-luna"

  # Fast/lightweight model — used for summarization, labeling, and taxonomy update.
  fast_llm: "openai/gpt-5.6-luna"

  # Embedding model — used for value consolidation and taxonomy biplot axis positions.
  # Supported providers: openai/<model>, ollama/<model>.
  embedding: "openai/text-embedding-3-small"

pipeline:
  # Maximum number of documents to process (0 = no limit).
  max_runs: 0

  # Number of documents to sample for processing (0 = use all).
  sample_size: 0

  # Size of minibatches for iterative taxonomy processing.
  batch_size: 10

  # Random seed for reproducibility (null = non-deterministic).
  random_seed: 4

  # Run mode: "train" (default) progressively builds and updates the taxonomy;
  # "test" freezes the seeded taxonomy's dimensions and only labels new
  # documents against them (new values may be appended, no-fit documents go
  # to labeling.fallback_category).
  mode: "train"

  # Path to a saved taxonomy JSON (e.g. output/taxonomy_<timestamp>.json) used
  # as the run's starting taxonomy. Required for test mode; in train mode it
  # seeds refinement instead of generating from scratch (null = from scratch).
  taxonomy_input: null

  # Which view of taxonomy_input seeds the run: "auto" (default) freezes the
  # selected view in test mode (the reported design space, without the dimensions
  # selection dropped) and refines the final iteration in train mode; "selected"
  # or "final" force one view.
  taxonomy_input_view: "auto"

# Optional external feedback injected into taxonomy refinement prompts.
# The resolved text reaches the same {feedback} slot used by update and review.
feedback:
  # Inline feedback text (wins over `file` when both are set).
  text: null

  # Path to a text/markdown file with feedback.
  file: null

taxonomy:
  # Optional name to identify this taxonomy (shown in output and JSON files).
  name: "taxonomy"

  # Maximum number of dimensions the LLM may produce (null = LLM decides from data).
  max_num_clusters: 8

  # Max words for cluster/category names.
  cluster_name_length: 10

  # Max words for cluster/category descriptions.
  cluster_description_length: 30

  # Max words for taxonomy suggestions.
  suggestion_length: 30

  # Max words for reasoning explanations in taxonomy output.
  explanation_length: 20

  # The use case description guiding taxonomy generation.
  use_case: >-
    Generate the taxonomy that can be used to label
    the user intent in the conversation.

  # Consecutive saturated minibatches required to stop the update loop early.
  # Empirically tunable against the example corpora.
  saturation_streak_threshold: 2

  # Embedding-distance cutoff (epsilon, Euclidean on L2-normalized vectors of
  # "label. description") below which two values of the same dimension and status
  # are merged automatically. Calibrated on C1 with text-embedding-3-small: the
  # closest same-status pairs sit at 0.54-0.75 and mix true duplicates with
  # genuinely different options, so almost nothing merges automatically.
  value_merge_distance_threshold: 0.35

  # Distance band above the cutoff routed to LLM adjudication (judge up to 0.75),
  # which keeps different options apart (e.g. data vs. model validation).
  value_merge_borderline_band: 0.40

  # Value consolidation: merge semantically duplicate values within each
  # dimension (embedding distance + LLM adjudication). When false, values
  # pass through unchanged and visualization uses unitary axis positions.
  consolidate_values: true
  # A candidate decision can be adopted by one source and rejected by another:
  # merge such values into one, keeping both stances as evidence (status "mixed").
  # False = values only merge within their exact status.
  merge_value_stances: true

  # Evidence linking after consolidation: assign every open code to its most similar
  # value (same decision status) and record the supporting documents on that value.
  link_evidence: true
  # Minimum cosine similarity for a code to count as evidence (text-embedding-3-small;
  # calibrated on C1: the best code-option similarity has median 0.57, so 0.35 accepted
  # 99% of codes and 0.5 accepts ~70%).
  evidence_min_similarity: 0.5
  # Remove values no document supports after evidence linking (kept inspectable on
  # their dimension as unsupported_values).
  drop_unsupported_values: true

  # ── Fragmentation controls ─────────────────────────────────────────
  # Keep the taxonomy from splitting one design decision into many overlapping
  # dimensions.

  # Merge near-duplicate dimensions (the same design decision under different
  # names) before value consolidation. Pairs below the distance threshold merge
  # automatically; pairs within the band above it go to an LLM judge, which merges
  # only when both dimensions' options answer one choice (detecting vs. mitigating
  # a problem stay separate). Distances are Euclidean on L2-normalized embeddings of
  # "name. description Options: ..."; with text-embedding-3-small, near-duplicates
  # sit around 0.55-0.90 and unrelated dimensions around 1.0. Set false to disable.
  merge_dimensions: true
  dimension_merge_distance_threshold: 0.45
  dimension_merge_borderline_band: 0.45

  # Minimum support: at dimension selection, drop (with a recorded rationale)
  # dimensions whose evidence comes from fewer than this many sources. A source is
  # the document a passage comes from (passage ids "sNN_pKK"), or the document
  # itself for other corpora. Needs link_evidence. 0 disables the rule.
  min_dimension_sources: 2

  # Decision points need alternatives: drop (with a recorded rationale) dimensions with
  # fewer than this many candidate decisions (accepted/rejected values; outcomes, i.e. effects
  # of decisions, do not count). 0 disables the rule.
  min_candidate_decisions: 2

  # Tolerant saturation: a minibatch also counts as saturated when at least this
  # share of its open codes is already covered by the taxonomy. 1.0 = strict
  # (every relevant code covered), which with detailed documents almost never
  # triggers, so the update loop keeps adding dimensions until the data runs out.
  saturation_min_coverage: 0.9
  # Minimum share of the corpus's documents open-coded before saturation may end the
  # update loop. Batches are random, so a few early batches can agree by chance;
  # saturation reached earlier is recorded but must still hold once this share is
  # reached. 0 = saturation alone decides.
  saturation_min_corpus_fraction: 0.7

summarization:
  # Skip summarization entirely (documents go directly to taxonomy generation).
  # When true, raw document content is used instead of summaries.
  skip: false

  # Max words for document summaries.
  summary_length: 20

  # Max words for summary explanations.
  explanation_length: 30

  # Max concurrent LLM requests during summarization (acts as a semaphore).
  max_concurrency: 5

open_coding:
  # What the open coder reads per document: "summary" (the summary when one
  # exists, else the content) or "content" (always the full document text, so
  # codes stay grounded in the source even when summarization is on).
  input: "summary"

labeling:
  # Fallback category when no taxonomy category fits.
  fallback_category: "Other"

  # Number of documents to sample for taxonomy review (null = uses batch_size).
  review_sample_size: 15

output:
  # Max documents shown in the rich display table.
  max_displayed_documents: 20

  # Max documents shown per category in the taxonomy tree view.
  max_docs_per_category_tree: 5

  # Characters shown in document preview column.
  content_preview_length: 100

  # Default directory for output files.
  default_output_dir: "output"

  # Pipeline graph diagram filename.
  graph_filename: "graph.png"

# Taxonomy biplot visualization (erdogant/pca based — values on dimension axes).
visualization:
  # Master on/off switch (default false — no cost/latency on normal runs).
  enabled: false

  # If false, only render the final (post-consolidation) chart; if true,
  # render at every stage (generate/update/review/consolidate).
  every_iteration: false

  # PCA projection dimensions: 2 or 3.
  dimensions: 2

  # Where chart files are written (null = default_output_dir / --output).
  output_dir: null

# Taxonomy evaluation scoreboard (deepeval GEval-based, observe-only).
evaluation:
  # Master on/off switch. When false, runs skip the evaluation step and the
  # pipeline topology is identical to pre-evaluation behavior.
  enabled: true

  # Judge model override (provider/model format). Falls back to models.model
  # (the main reasoning model, matching the review node's choice).
  judge_model: null

  # Display-only pass threshold (0-1) per criterion. Nothing gates on it.
  threshold: 0.5

  # Embedding-distance cutoff (Euclidean on L2-normalized vectors) below
  # which dimensions from different taxonomies align automatically during
  # consistency comparison. Calibrated for openai/text-embedding-3-small.
  consistency_threshold: 0.25

  # Distance band above the cutoff routed to judge adjudication instead of
  # auto-align or auto-reject.
  consistency_borderline_band: 0.08

  # Max documents sampled for the data-grounded criteria. The sample is drawn
  # across sources with pipeline.random_seed and is the same at every evaluation
  # of a run (and in standalone --evaluate), so scores stay comparable.
  max_documents: 20

  # Save every scoreboard of the run (taxonomy JSON "evaluation_history": one per
  # iteration, then the final view) and show the scores across iterations. The
  # loop's feedback uses the scores either way.
  save_history: true
  # Criteria scored and reported but not fed back to the update/review passes.
  # Completeness is judged against the use case alone (the judge sees no data), so
  # in the loop it pushes for use-case topics the corpus may not support; gaps in
  # the data are fed back by the saturation critic and the coverage criteria.
  feedback_exclude: ["Completeness"]
  # Score the loop's drafts every N iterations (1 for small corpora; 3 for large ones such as C1/C2). The draft
  # of the last minibatch and the final view are always scored; feedback reaches only
  # the update that follows a scored draft.
  every_n_iterations: 1

# ---------------------------------------------------------------------------
# Ground-truth matcher (python main.py --match-gt): scores a design space against an
# expert design space (benchmark/<study>/gt/). Uncomment to use.
# ---------------------------------------------------------------------------
# matcher:
#   # Judge of borderline value-option pairs (provider/model, OpenAI only). Required: no
#   # default, no fallback to models.model, and it must differ from the generator model.
#   judge_model: "openai/gpt-5.4-mini"
#   # Embedding model; null uses models.embedding.
#   embedding: null
#   # Cosine distance between embeddings (1 - cosine similarity; lower is closer): at or below
#   # lower_threshold a pair is "same" without the judge; above upper_threshold it is
#   # "different"; in between the judge labels it (same, broader, narrower, related,
#   # different). Fix the values before scoring any run (benchmark/README.md, "Evaluation frame").
#   lower_threshold: 0.10
#   upper_threshold: 0.45
#   # Borderline pairs reach the judge only when one item is among the other's
#   # max_candidates nearest neighbours.
#   max_candidates: 5
#   # Count outcome values as system values (sensitivity run; default: candidates only).
#   include_outcomes: false
#   # Minimum share of matched values/options for a dimension to align with a decision.
#   min_alignment_share: 0.25
#   # Seed of the order in which the judge sees the two items of a pair.
#   seed: 0
#   # Judge results cache, reused across reruns.
#   cache_path: ".cache/gt_match_judge.json"
