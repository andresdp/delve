<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Delve workflow: inputs, roles and outputs">
  <title>Delve: inputs, the agentic workflow with its four roles, and outputs</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5160"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1d2129; }
      .col { font-size: 13px; font-weight: 700; fill: #6b7280; letter-spacing: .08em; }
      .band { font-size: 12.5px; font-weight: 700; fill: #4a5160; }
      .bandi { font-size: 11.5px; font-style: italic; fill: #6b7280; }
      .t { font-size: 14px; font-weight: 700; }
      .s { font-size: 12px; fill: #374151; }
      .xs { font-size: 11px; fill: #4a5160; }
      .lab { font-size: 11px; font-style: italic; fill: #4a5160; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
      .flow { stroke: #4a5160; stroke-width: 1.6; fill: none; }
      .fb { stroke: #4a5160; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
    </style>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>

  <!-- column headers -->
  <text class="col" x="73" y="22" text-anchor="middle">INPUTS</text>
  <text class="col" x="436" y="22" text-anchor="middle">WORKFLOW</text>
  <text class="col" x="814" y="22" text-anchor="middle">OUTPUTS</text>

  <!-- ===== inputs ===== -->
  <path d="M12,48 v64 a61,8 0 0 0 122,0 v-64" fill="#eef1f6" stroke="#8ea3c7" stroke-width="1.6"/>
  <ellipse cx="73" cy="48" rx="61" ry="8" fill="#f6f8fb" stroke="#8ea3c7" stroke-width="1.6"/>
  <text class="t" x="73" y="80" text-anchor="middle">Corpus</text>
  <text class="s" x="73" y="96" text-anchor="middle">sources split into</text>
  <text class="s" x="73" y="110" text-anchor="middle">~300-word passages</text>

  <rect x="12" y="134" width="122" height="78" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text class="t" x="73" y="153" text-anchor="middle">Use case</text>
  <text class="s" x="73" y="168" text-anchor="middle">purpose of the space</text>
  <text class="t" x="73" y="188" text-anchor="middle">Configuration</text>
  <text class="s" x="73" y="203" text-anchor="middle">models, thresholds</text>

  <rect x="12" y="250" width="122" height="78" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="xs" x="73" y="267" text-anchor="middle">optional, between runs</text>
  <text class="s" x="73" y="285" text-anchor="middle">prior design space</text>
  <text class="s" x="73" y="300" text-anchor="middle">+ human feedback</text>
  <text class="xs" x="73" y="316" text-anchor="middle">to updates and review</text>


  <!-- ===== band A: open + axial coding ===== -->
  <rect x="148" y="32" width="576" height="170" rx="10" fill="#f7f8fa" stroke="#e2e5ea"/>
  <text class="band" x="158" y="50">Open and axial coding</text>
  <text class="bandi" x="714" y="50" text-anchor="end">one iteration per minibatch</text>

  <!-- minibatches (deterministic) -->
  <rect x="157" y="74" width="74" height="96" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="t" x="194" y="110" text-anchor="middle">Batches</text>
  <text class="s" x="194" y="127" text-anchor="middle">shuffled,</text>
  <text class="s" x="194" y="141" text-anchor="middle">size b</text>

  <!-- coder -->
  <rect x="244" y="74" width="120" height="96" rx="8" fill="#e6f7f5" stroke="#2EC4B6" stroke-width="1.8"/>
  <text class="tag" x="304" y="91" text-anchor="middle" fill="#1f8c82">CODER</text>
  <text class="t" x="304" y="112" text-anchor="middle">Open coding</text>
  <text class="s" x="304" y="130" text-anchor="middle">codes + stance</text>
  <text class="s" x="304" y="144" text-anchor="middle">per passage</text>

  <!-- taxonomist -->
  <rect x="378" y="74" width="150" height="96" rx="8" fill="#fff6e0" stroke="#FFB703" stroke-width="1.8"/>
  <text class="tag" x="453" y="91" text-anchor="middle" fill="#a66b10">TAXONOMIST</text>
  <text class="t" x="453" y="112" text-anchor="middle">Draft / update</text>
  <text class="s" x="453" y="130" text-anchor="middle">decision points via</text>
  <text class="s" x="453" y="144" text-anchor="middle">validated, logged edits</text>

  <!-- critic -->
  <rect x="542" y="74" width="128" height="96" rx="8" fill="#ffecec" stroke="#FF6B6B" stroke-width="1.8"/>
  <text class="tag" x="606" y="91" text-anchor="middle" fill="#b83232">CRITIC</text>
  <text class="t" x="606" y="112" text-anchor="middle">Scoreboard +</text>
  <text class="s" x="606" y="130" text-anchor="middle">coverage check vs.</text>
  <text class="s" x="606" y="144" text-anchor="middle">pre-batch model</text>

  <line class="flow" x1="231" y1="112" x2="242" y2="112" marker-end="url(#a)"/>
  <line class="flow" x1="364" y1="112" x2="376" y2="112" marker-end="url(#a)"/>
  <line class="flow" x1="528" y1="112" x2="540" y2="112" marker-end="url(#a)"/>

  <!-- loop back: next minibatch -->
  <path class="flow" d="M606,74 V63 H304 V72" marker-end="url(#a)"/>
  <text class="lab" x="455" y="59" text-anchor="middle">not yet covered: next minibatch</text>

  <!-- feedback: critic to taxonomist -->
  <path class="fb" d="M580,170 C580,192 490,192 490,172" marker-end="url(#a)"/>
  <text class="lab" x="535" y="198" text-anchor="middle">feedback</text>

  <!-- exit to selective coding -->
  <text class="lab" x="454" y="217" text-anchor="middle">covered k batches in a row (after a minimum share), or corpus done</text>

  <!-- ===== band B: selective coding ===== -->
  <rect x="148" y="232" width="576" height="150" rx="10" fill="#f7f8fa" stroke="#e2e5ea"/>
  <text class="band" x="714" y="250" text-anchor="end">Selective coding</text>

  <!-- review -->
  <rect x="157" y="262" width="104" height="96" rx="8" fill="#fff6e0" stroke="#FFB703" stroke-width="1.8"/>
  <text class="tag" x="209" y="279" text-anchor="middle" fill="#a66b10">TAXONOMIST</text>
  <text class="t" x="209" y="300" text-anchor="middle">Review</text>
  <text class="s" x="209" y="318" text-anchor="middle">against a</text>
  <text class="s" x="209" y="332" text-anchor="middle">fresh sample</text>

  <!-- integrator -->
  <rect x="274" y="262" width="318" height="96" rx="8" fill="#e8f0fe" stroke="#4C8BF5" stroke-width="1.8"/>
  <text class="tag" x="433" y="279" text-anchor="middle" fill="#2b5fb0">INTEGRATOR</text>
  <rect x="281" y="288" width="76" height="60" rx="6" fill="#ffffff" stroke="#4C8BF5" stroke-width="1.2"/>
  <text class="s" x="319" y="313" text-anchor="middle">Merge +</text>
  <text class="s" x="319" y="328" text-anchor="middle">consolidate</text>
  <rect x="364" y="288" width="72" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text class="s" x="400" y="313" text-anchor="middle">Link</text>
  <text class="s" x="400" y="328" text-anchor="middle">evidence</text>
  <rect x="443" y="288" width="66" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text class="s" x="476" y="313" text-anchor="middle">Select</text>
  <text class="s" x="476" y="328" text-anchor="middle">by support</text>
  <rect x="516" y="288" width="68" height="60" rx="6" fill="#ffffff" stroke="#4C8BF5" stroke-width="1.2"/>
  <text class="s" x="550" y="313" text-anchor="middle">Label</text>
  <text class="s" x="550" y="328" text-anchor="middle">passages</text>
  <line class="flow" x1="357" y1="318" x2="362" y2="318" marker-end="url(#a)"/>
  <line class="flow" x1="436" y1="318" x2="441" y2="318" marker-end="url(#a)"/>
  <line class="flow" x1="509" y1="318" x2="514" y2="318" marker-end="url(#a)"/>

  <!-- final critic -->
  <rect x="604" y="262" width="112" height="96" rx="8" fill="#ffecec" stroke="#FF6B6B" stroke-width="1.8"/>
  <text class="tag" x="660" y="279" text-anchor="middle" fill="#b83232">CRITIC</text>
  <text class="t" x="660" y="300" text-anchor="middle">Final score</text>
  <text class="s" x="660" y="318" text-anchor="middle">of selected view;</text>
  <text class="s" x="660" y="332" text-anchor="middle">does not steer</text>

  <line class="flow" x1="261" y1="310" x2="272" y2="310" marker-end="url(#a)"/>
  <line class="flow" x1="592" y1="310" x2="602" y2="310" marker-end="url(#a)"/>

  <!-- ===== outputs ===== -->
  <line x1="732" y1="40" x2="732" y2="382" stroke="#9ca3af" stroke-width="1.4"/>
  <line class="flow" x1="716" y1="310" x2="730" y2="310" marker-end="url(#a)"/>

  <rect x="738" y="40" width="152" height="134" rx="8" fill="#eef1f6" stroke="#1d2129" stroke-width="1.8"/>
  <text class="t" x="814" y="60" text-anchor="middle">Design space</text>
  <text class="s" x="814" y="78" text-anchor="middle">decision points</text>
  <text class="s" x="814" y="93" text-anchor="middle">candidate decisions:</text>
  <text class="xs" x="814" y="107" text-anchor="middle">accepted / rejected /</text>
  <text class="xs" x="814" y="120" text-anchor="middle">mixed, or outcome</text>
  <text class="s" x="814" y="137" text-anchor="middle">relations</text>
  <text class="s" x="814" y="152" text-anchor="middle">evidence links to</text>
  <text class="s" x="814" y="166" text-anchor="middle">passages</text>

  <rect x="738" y="184" width="152" height="50" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <text class="t" x="814" y="204" text-anchor="middle">Run history</text>
  <text class="s" x="814" y="222" text-anchor="middle">drafts, operation log</text>

  <rect x="738" y="244" width="152" height="44" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <text class="t" x="814" y="263" text-anchor="middle">Labeled passages</text>
  <text class="s" x="814" y="279" text-anchor="middle">one decision each</text>

  <rect x="738" y="298" width="152" height="36" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <text class="t" x="814" y="321" text-anchor="middle">Scoreboards</text>

  <rect x="738" y="344" width="152" height="38" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <text class="t" x="814" y="360" text-anchor="middle">Reports + wiki</text>
  <text class="xs" x="814" y="375" text-anchor="middle">Markdown, HTML, browsable</text>

  <!-- arrows drawn last, above the band backgrounds -->
  <line class="flow" x1="134" y1="96" x2="155" y2="96" marker-end="url(#a)"/>
  <line class="flow" x1="134" y1="173" x2="147" y2="173" marker-end="url(#a)"/>
  <line class="fb" x1="134" y1="300" x2="154" y2="300" marker-end="url(#a)"/>
  <path class="flow" d="M670,122 H700 V222 H208 V258" marker-end="url(#a)"/>

  <!-- ===== legend ===== -->
  <g transform="translate(150,406)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#e6f7f5" stroke="#2EC4B6" stroke-width="1.6"/>
    <text class="s" x="20" y="11">Coder</text>
    <rect x="72" y="0" width="14" height="14" rx="3" fill="#fff6e0" stroke="#FFB703" stroke-width="1.6"/>
    <text class="s" x="92" y="11">Taxonomist</text>
    <rect x="172" y="0" width="14" height="14" rx="3" fill="#ffecec" stroke="#FF6B6B" stroke-width="1.6"/>
    <text class="s" x="192" y="11">Critic</text>
    <rect x="244" y="0" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#4C8BF5" stroke-width="1.6"/>
    <text class="s" x="264" y="11">Integrator</text>
    <rect x="350" y="0" width="14" height="14" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 2"/>
    <text class="s" x="370" y="11">deterministic (no LLM)</text>
    <line class="flow" x1="512" y1="7" x2="540" y2="7" marker-end="url(#a)"/>
    <text class="s" x="546" y="11">flow</text>
    <line class="fb" x1="584" y1="7" x2="612" y2="7" marker-end="url(#a)"/>
    <text class="s" x="618" y="11">feedback</text>
  </g>
</svg>
